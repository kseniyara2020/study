<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Учёба">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Мой учебный план</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: iOS grouped lists on a grouped background; bottom tab bar on phone, sidebar from 900px (macOS). */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --side:#EBEBF0;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --bar:rgba(249,249,249,.86);
  --accent:#5856D6; --accent-soft:rgba(88,86,214,.12);
  --blue:#007AFF; --orange:#FF9500; --pink:#FF2D55; --green:#34C759; --red:#FF3B30; --teal:#30B0C7;
  --green-soft:rgba(52,199,89,.14); --red-soft:rgba(255,59,48,.12);
  /* Spacing & shape tokens (pt). Change here — applies everywhere. */
  --gutter:16px; --section-gap:26px; --head-gap:7px; --block-gap:10px;
  --row-pad-y:11px; --row-pad-x:16px; --row-min:44px; --row-gap:12px; --row-inset:60px;
  --card-pad:16px; --tile-size:30px;
  --radius-group:10px; --radius-card:12px; --radius-tile:7px; --radius-sheet:12px;
  --fs-large:34px; --fs-title:20px; --fs-body:17px; --fs-sub:15px; --fs-foot:13px; --fs-tab:10px;
  --tabbar-h:49px; --nav-h:44px; --tab-pad-top:4px;
  --tab-inactive:#919191;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --side:#161618;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.86);
  --accent:#7D7AFF; --accent-soft:rgba(125,122,255,.18);
  --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F; --green:#30D158; --red:#FF453A; --teal:#40C8E0;
  --green-soft:rgba(48,209,88,.18); --red-soft:rgba(255,69,58,.18);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --side:#161618;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.86);
  --accent:#7D7AFF; --accent-soft:rgba(125,122,255,.18);
  --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F; --green:#30D158; --red:#FF453A; --teal:#40C8E0;
  --green-soft:rgba(48,209,88,.18); --red-soft:rgba(255,69,58,.18);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--label);font:17px/22px var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
button{font:inherit;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0}

/* Sidebar (Mac) */
.sidebar{display:none}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;gap:2px;width:248px;flex:none;position:sticky;top:0;height:100vh;
    background:var(--side);border-right:.5px solid var(--sep);padding:20px 10px 10px max(10px,env(safe-area-inset-left,0px))}
  .side-h{font-size:13px;font-weight:600;color:var(--label2);padding:4px 10px 8px}
  .side-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:15px;cursor:pointer;color:var(--label)}
  .side-i svg{color:var(--accent);width:20px;height:20px}
  .side-i:hover{background:var(--fill)}
  .side-i.on{background:var(--accent);color:#fff}
  .side-i.on svg{color:#fff}
  .tabbar{display:none!important}
  .content{padding-bottom:48px!important}
}

/* Nav bar + large title */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.nav.scrolled,.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.scrolled .nav-t,.nav.solid .nav-t{opacity:1}
.nav-l{justify-self:start}.nav-r{justify-self:end;display:flex;gap:4px}
.nav-btn{display:flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:17px}
.nav-btn svg{width:22px;height:22px}
.content{max-width:720px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.large{font-size:var(--fs-large);line-height:41px;font-weight:700;letter-spacing:.37px;margin:2px 0 2px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;line-height:20px;margin:0 0 18px;letter-spacing:-.24px}
.sub:first-letter{text-transform:uppercase}

/* Grouped lists */
.ghead{font-size:var(--fs-foot);line-height:18px;text-transform:uppercase;letter-spacing:.2px;color:var(--label2);margin:var(--section-gap) var(--row-pad-x) var(--head-gap);display:flex;align-items:center;gap:8px}
.ghead:first-child{margin-top:8px}
.gfoot{font-size:var(--fs-foot);line-height:18px;color:var(--label2);margin:var(--head-gap) var(--row-pad-x) 0;letter-spacing:-.08px}
.group{background:var(--card);border-radius:var(--radius-group);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--row-gap);width:100%;min-height:var(--row-min);padding:var(--row-pad-y) var(--row-pad-x);background:none;border:0;text-align:left;cursor:pointer;position:relative;color:var(--label)}
button.row:active,a.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:var(--inset,var(--row-pad-x));right:0;height:.5px;background:var(--sep)}
.group.icons .row{--inset:var(--row-inset)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:var(--fs-body);line-height:22px}
.row-sub{font-size:var(--fs-foot);line-height:18px;color:var(--label2);letter-spacing:-.08px}
.row-val{color:var(--label2);font-size:17px;white-space:nowrap}
.row .chev{color:var(--label3);width:14px;height:14px}
.row.static{cursor:default}
.tile{width:var(--tile-size);height:var(--tile-size);border-radius:var(--radius-tile);display:grid;place-items:center;color:#fff;flex:none}
.tile svg{width:18px;height:18px}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:13px;font-weight:600;letter-spacing:-.08px;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.big{height:30px;padding:0 12px;border-radius:15px;font-size:var(--fs-body);font-weight:700;letter-spacing:-.2px}

/* Today header strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--block-gap)}
.stat{background:var(--card);border-radius:var(--radius-card);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:22px;line-height:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stat b svg{width:18px;height:18px;color:var(--orange)}
.stat span{font-size:13px;color:var(--label2);line-height:16px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:var(--section-gap) 0 0;background:var(--card);border-radius:var(--radius-group);padding:4px}
.daybar .nav-btn{min-width:44px;justify-content:center}
.daybar .nav-btn:disabled{color:var(--label3);cursor:default}
.daybar-t{text-align:center;min-width:0}
.daybar-t b{display:block;font-size:15px;font-weight:600}
.daybar-t span{display:block;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:var(--row-gap);width:100%;margin-top:var(--block-gap);padding:14px var(--card-pad);border:0;border-radius:var(--radius-card);background:var(--accent);color:#fff;text-align:left;cursor:pointer}
.banner .row-sub{color:rgba(255,255,255,.8)}
.banner svg.chev{color:rgba(255,255,255,.7);width:14px;height:14px}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 4px}
.seg button{border:0;background:none;border-radius:7px;height:30px;font-size:13px;font-weight:500;cursor:pointer;color:var(--label)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:var(--card2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--card2)}}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border:0;border-radius:var(--radius-card);background:var(--accent);color:#fff;font-size:var(--fs-body);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:none;color:var(--accent);font-weight:400;min-height:44px}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btns{display:flex;gap:var(--block-gap);margin-top:var(--card-pad)}
.btns .btn{flex:1}
.actions{display:flex;flex-direction:column;gap:var(--block-gap);margin-top:20px}

/* Task screens */
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.progress{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.qcount{font-size:13px;color:var(--label2);margin-top:8px}
.panel{background:var(--card);border-radius:var(--radius-card);padding:var(--card-pad)}
.q{font-size:var(--fs-title);line-height:26px;font-weight:600;letter-spacing:.38px;margin:0 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:12px var(--card-pad);border-radius:var(--radius-card);border:0;background:var(--card);text-align:left;cursor:pointer;font-size:var(--fs-body)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-soft);color:var(--green);font-weight:600}
.opt.wrong{background:var(--red-soft);color:var(--red)}
.opt.dim{opacity:.5}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--card);font-size:15px;line-height:20px;letter-spacing:-.24px}
.fb b{display:block;margin-bottom:4px;font-size:17px}
.fb.ok b{color:var(--green)}.fb.no b{color:var(--red)}
.field{width:100%;min-height:50px;padding:12px var(--card-pad);border-radius:var(--radius-card);border:0;background:var(--card);color:var(--label);font:17px/22px var(--font);letter-spacing:-.41px}
textarea.field{min-height:180px;resize:vertical}
.field::placeholder{color:var(--label3)}
.audio{display:flex;align-items:center;gap:var(--row-gap);background:var(--card);border-radius:var(--radius-card);padding:12px;margin-bottom:var(--card-pad)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px}
.play.small{width:32px;height:32px;background:var(--accent-soft);color:var(--accent)}
.play.small svg{width:14px;height:14px}
.audio-t{flex:1;min-width:0}
.audio-t b{display:block;font-size:15px;font-weight:600}
.audio-t span{font-size:13px;color:var(--label2)}
.chip{border:0;background:var(--fill);color:var(--label);height:32px;padding:0 12px;border-radius:16px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.transcript{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;font-size:15px;line-height:20px;letter-spacing:-.24px}
.line b{flex:none;width:86px;color:var(--label2);font-weight:500;font-size:13px;padding-top:1px}
.lesson p{margin:0 0 12px;font-size:17px;line-height:24px}
.ex{display:flex;align-items:center;gap:12px}
.ex .row-title{font-size:16px}
.flash{background:var(--card);border-radius:16px;min-height:260px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border:0;width:100%;cursor:pointer}
.flash .en{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;text-wrap:balance}
.flash .ru{font-size:19px;line-height:24px;color:var(--label)}
.flash .exs{font-size:15px;line-height:20px;color:var(--label2);font-style:italic;max-width:34ch}
.flash .tap{font-size:13px;color:var(--label3)}
.wc{font-size:13px;color:var(--label2);margin-top:6px;font-variant-numeric:tabular-nums}
.hint{font-size:15px;color:var(--label2);line-height:20px;margin:0 0 12px}
.prompt{font-size:17px;line-height:24px;margin:0 0 10px}
.summary{text-align:center;padding:28px 16px}
.summary .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.summary p{color:var(--label2);margin:6px 0 0}

/* Progress screen */
.cefr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.cefr div{height:30px;border-radius:6px;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2)}
.cefr div.cur{background:var(--accent);color:#fff}
.cefr div.goal{background:var(--accent-soft);color:var(--accent);outline:1.5px dashed var(--accent);outline-offset:-1.5px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--label2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.days14{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:12px}
.days14 i{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--fill)}
.days14 i.on{background:var(--accent)}

/* Media */
.poster{width:56px;height:76px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.3px;line-height:16px;text-align:center;
  background:linear-gradient(160deg,#1E9E5A,#0B5B34)}
.epi{font-family:var(--mono);font-size:13px;color:var(--label2)}
.empty{text-align:center;padding:36px 20px;color:var(--label2);font-size:15px;line-height:20px}
.empty b{display:block;color:var(--label);font-size:17px;margin-bottom:6px}
.empty svg{width:44px;height:44px;color:var(--label3);margin-bottom:10px}
.del{border:0;background:none;color:var(--red);font-size:15px;padding:6px;cursor:pointer;min-width:44px;min-height:44px}

/* Settings controls */
.row select,.row input[type=time]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;color:var(--label);font:15px var(--font);max-width:52vw}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row input.inline{flex:1;min-width:0;border:0;background:none;color:var(--label);font:17px var(--font);text-align:right;padding:0}
.row input.inline::placeholder{color:var(--label3)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;height:var(--tabbar-h);padding:var(--tab-pad-top) 0 0;border:0;background:none;color:var(--tab-inactive);font-size:10px;font-weight:500;letter-spacing:.1px;cursor:pointer}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:86vh}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.sheet-h b{font-size:17px;font-weight:600}
.sheet-h .nav-btn:last-child{justify-self:end;font-weight:600}
.sheet-h .nav-btn:disabled{color:var(--label3)}
.trbox{background:var(--card);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:20px}
.trbox .ru{font-size:17px;font-weight:600;margin-bottom:4px}
.trbox a{color:var(--accent);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;color:var(--label2);margin:4px 16px -4px}
.code{width:100%;min-height:200px;font:12px/16px var(--mono);border:0;border-radius:12px;background:var(--card);color:var(--label);padding:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--label);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:calc(100% - 32px);animation:fade .2s}
.opt.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.passage{white-space:pre-line;font-size:var(--fs-sub);line-height:21px;margin-bottom:16px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--label);border-radius:var(--radius-card);padding:12px var(--card-pad);margin-bottom:var(--block-gap);font-size:var(--fs-sub);line-height:20px}
.notice svg{color:var(--accent);width:20px;height:20px;flex:none;margin-top:1px}
.notice b{font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

<script type="application/json" id="seed-pack">{"type": "study-pack", "version": 1, "id": "pack-001", "title": "Неделя 1: make/do, used to, wish и разговор о макетах", "level": "B1", "created": "2026-10-30", "vocab": [{"id": "g1", "en": "make a decision", "ru": "принять решение", "ex": "We need to make a decision by Friday.", "lvl": "B1", "tag": "general"}, {"id": "g2", "en": "do someone a favour", "ru": "оказать услугу, сделать одолжение", "ex": "Could you do me a favour and check this file?", "lvl": "B1", "tag": "general"}, {"id": "g3", "en": "make a mistake", "ru": "ошибиться, допустить ошибку", "ex": "Everyone makes mistakes when they start.", "lvl": "A2", "tag": "general"}, {"id": "g4", "en": "do research", "ru": "проводить исследование", "ex": "We did some user research before the redesign.", "lvl": "B1", "tag": "general"}, {"id": "g5", "en": "make progress", "ru": "продвигаться, делать успехи", "ex": "I'm making real progress with my English.", "lvl": "B1", "tag": "general"}, {"id": "g6", "en": "do your best", "ru": "сделать всё возможное", "ex": "Don't worry about the result, just do your best.", "lvl": "B1", "tag": "general"}, {"id": "g7", "en": "call off", "ru": "отменить", "ex": "They called off the meeting because the client was ill.", "lvl": "B2", "tag": "general"}, {"id": "g8", "en": "put off", "ru": "отложить, откладывать", "ex": "Stop putting off the difficult tasks.", "lvl": "B2", "tag": "general"}, {"id": "g9", "en": "come up with", "ru": "придумать, предложить (идею)", "ex": "She came up with a much simpler solution.", "lvl": "B2", "tag": "general"}, {"id": "g10", "en": "figure out", "ru": "разобраться, понять", "ex": "I can't figure out why this layout breaks.", "lvl": "B2", "tag": "general"}, {"id": "g11", "en": "point out", "ru": "указать, обратить внимание на", "ex": "He pointed out a problem in the checkout flow.", "lvl": "B2", "tag": "general"}, {"id": "g12", "en": "carry on", "ru": "продолжать", "ex": "Sorry for interrupting, please carry on.", "lvl": "B1", "tag": "general"}, {"id": "g13", "en": "compelling", "ru": "убедительный, захватывающий", "ex": "She made a compelling case for the redesign.", "lvl": "C1", "tag": "general"}, {"id": "g14", "en": "compulsory", "ru": "обязательный", "ex": "The training is compulsory for all new employees.", "lvl": "B2", "tag": "general"}, {"id": "g15", "en": "sensible", "ru": "разумный, здравый", "ex": "That sounds like a sensible plan.", "lvl": "B1", "tag": "general"}, {"id": "g16", "en": "sensitive", "ru": "чувствительный, деликатный", "ex": "Salary is a sensitive topic in our team.", "lvl": "B2", "tag": "general"}, {"id": "g17", "en": "eventually", "ru": "в конце концов, со временем", "ex": "We eventually found the cause of the bug.", "lvl": "B1", "tag": "general"}, {"id": "g18", "en": "actually", "ru": "на самом деле, вообще-то", "ex": "Actually, the deadline is next week, not tomorrow.", "lvl": "B1", "tag": "general"}, {"id": "u1", "en": "stakeholder", "ru": "стейкхолдер, заинтересованное лицо", "ex": "We'll present the concept to the stakeholders on Monday.", "lvl": "C1", "tag": "ux"}, {"id": "u2", "en": "wireframe", "ru": "вайрфрейм, схема экрана", "ex": "I sketched a few wireframes for the new dashboard.", "lvl": "pro", "tag": "ux"}, {"id": "u3", "en": "pain point", "ru": "болевая точка, проблема пользователя", "ex": "Slow search is the main pain point for our users.", "lvl": "pro", "tag": "ux"}, {"id": "u4", "en": "iterate on", "ru": "дорабатывать итерациями", "ex": "Let's test it and iterate on the design.", "lvl": "pro", "tag": "ux"}, {"id": "u5", "en": "hand-off", "ru": "передача макетов в разработку", "ex": "The hand-off to developers is planned for Friday.", "lvl": "pro", "tag": "ux"}, {"id": "u6", "en": "edge case", "ru": "пограничный, редкий случай", "ex": "What happens in the edge case when the list is empty?", "lvl": "pro", "tag": "ux"}, {"id": "u7", "en": "walk someone through", "ru": "показать шаг за шагом, провести по", "ex": "Let me walk you through the new flow.", "lvl": "B2", "tag": "ux"}, {"id": "u8", "en": "rationale", "ru": "обоснование, логика решения", "ex": "Can you explain the rationale behind this layout?", "lvl": "C1", "tag": "ux"}, {"id": "u9", "en": "trade-off", "ru": "компромисс, выбор с потерями", "ex": "A simpler animation is a good trade-off for the first release.", "lvl": "C1", "tag": "ux"}, {"id": "u10", "en": "follow up (on)", "ru": "вернуться к вопросу, напомнить", "ex": "I'm just following up on my last email.", "lvl": "B2", "tag": "ux"}, {"id": "u11", "en": "align on", "ru": "согласовать, прийти к общему мнению", "ex": "Let's align on the scope before we start.", "lvl": "pro", "tag": "ux"}, {"id": "u12", "en": "deliverable", "ru": "результат работы, то, что сдаём", "ex": "The main deliverable is a clickable prototype.", "lvl": "pro", "tag": "ux"}], "days": [{"day": 1, "title": "make или do", "general": [{"id": "p1-d1-g1", "type": "lesson", "title": "make или do", "minutes": 5, "body": ["В русском и «делать», и «сделать» — одно слово. В английском глагол зависит от существительного, и это просто нужно запомнить парами.", "**make** — когда появляется результат: решение, ошибка, план, деньги, прогресс.", "**do** — когда выполняем действие или работу: исследование, задание, одолжение, «всё возможное».", "Если не уверены, учите целую фразу, а не одно слово: не «favour», а «do someone a favour»."], "examples": [{"en": "We need to make a decision today.", "ru": "Нам нужно принять решение сегодня."}, {"en": "I made a mistake in the spacing.", "ru": "Я ошиблась в отступах."}, {"en": "Could you do me a favour?", "ru": "Можешь оказать мне услугу?"}, {"en": "We did some research first.", "ru": "Сначала мы провели исследование."}]}, {"id": "p1-d1-g2", "type": "cards", "title": "6 сочетаний с make и do", "minutes": 5, "cards": ["g1", "g2", "g3", "g4", "g5", "g6"]}, {"id": "p1-d1-g3", "type": "quiz", "title": "make или do: практика", "minutes": 5, "items": [{"q": "It's time to ___ a decision about the logo.", "options": ["do", "make", "take"], "a": 1, "explain": "make a decision — принять решение. Вариант take a decision тоже встречается в британском английском, но make — основной."}, {"q": "Could you ___ me a favour and send the file?", "options": ["make", "give", "do"], "a": 2, "explain": "do someone a favour — устойчивое сочетание."}, {"q": "Before the redesign we ___ some user research.", "options": ["did", "made", "had"], "a": 0, "explain": "do research — проводить исследование."}, {"q": "Don't worry, everyone ___ mistakes.", "options": ["does", "makes", "takes"], "a": 1, "explain": "make a mistake — ошибаться."}, {"q": "You're ___ great progress with your English!", "options": ["making", "doing", "having"], "a": 0, "explain": "make progress — продвигаться."}, {"q": "Just ___ your best, nobody expects perfection.", "options": ["make", "try", "do"], "a": 2, "explain": "do your best — сделать всё возможное."}]}], "ux": [{"id": "p1-d1-u1", "type": "cards", "title": "Слова дизайн-ревью", "minutes": 6, "cards": ["u1", "u2", "u3", "u4", "u5", "u6"]}, {"id": "p1-d1-u2", "type": "dialog", "title": "Диалог: ревью вайрфреймов", "minutes": 8, "lines": [{"s": "PM", "t": "Thanks for sharing the wireframes. Before we go further, can you walk me through the main flow?"}, {"s": "Designer", "t": "Sure. We start on the dashboard. Users told us the old filters were a real pain point, so I moved them to the top."}, {"s": "PM", "t": "Makes sense. What about the edge case when a user has no documents yet?"}, {"s": "Designer", "t": "Good point. I haven't designed that state yet. I'll add an empty state and iterate on it before the hand-off."}, {"s": "PM", "t": "Great. Let's share it with the stakeholders on Thursday."}], "items": [{"q": "Why did the designer move the filters to the top?", "options": ["The stakeholders asked for it", "Users found the old filters difficult", "Developers wanted a simpler layout"], "a": 1, "explain": "Users told us the old filters were a real pain point — пользователи жаловались на старые фильтры."}, {"q": "What hasn't the designer designed yet?", "options": ["The empty state", "The dashboard", "The filters"], "a": 0, "explain": "I haven't designed that state yet. I'll add an empty state…"}, {"q": "When will they show the design to the stakeholders?", "options": ["On Tuesday", "After the hand-off", "On Thursday"], "a": 2, "explain": "Let's share it with the stakeholders on Thursday."}]}]}, {"day": 2, "title": "used to, be used to, get used to", "general": [{"id": "p1-d2-g1", "type": "lesson", "title": "Три вида used to", "minutes": 6, "body": ["**used to + глагол** — так было раньше, сейчас уже нет: I used to work in an office (раньше работала в офисе).", "**be used to + -ing** — привыкла, для меня это нормально: I'm used to working from home.", "**get used to + -ing** — привыкаю, процесс: I'm getting used to working with a new team.", "Главная ловушка: после be used to и get used to стоит **-ing** или существительное, а не голый глагол. «I'm used to get up» — ошибка."], "examples": [{"en": "I used to draw by hand.", "ru": "Раньше я рисовала от руки."}, {"en": "I'm used to getting feedback.", "ru": "Я привыкла получать обратную связь."}, {"en": "You'll get used to it.", "ru": "Ты привыкнешь."}, {"en": "We didn't use to have design reviews.", "ru": "Раньше у нас не было дизайн-ревью."}]}, {"id": "p1-d2-g2", "type": "gap", "title": "Впишите правильную форму", "minutes": 6, "items": [{"q": "When I was a child, I ___ (play) the piano.", "a": ["used to play"], "explain": "Привычка в прошлом, которой больше нет: used to + глагол."}, {"q": "She is used to ___ (work) late.", "a": ["working"], "explain": "be used to + -ing."}, {"q": "I'm not used to ___ (speak) English at work.", "a": ["speaking"], "explain": "be used to + -ing, отрицание делаем через not."}, {"q": "Don't worry, you'll get used to ___ (use) Figma variables.", "a": ["using"], "explain": "get used to + -ing."}, {"q": "We ___ (not / have) design reviews, but now we have them every week.", "a": ["didn't use to have", "did not use to have", "never used to have"], "explain": "Отрицание: didn't use to (без -d после didn't)."}, {"q": "It took me a month to get used to ___ (wake) up at 6.", "a": ["waking"], "explain": "get used to + -ing."}]}, {"id": "p1-d2-g3", "type": "dictation", "title": "Диктант: used to", "minutes": 4, "items": [{"say": "I'm used to working from home.", "a": ["I'm used to working from home", "I am used to working from home"]}, {"say": "We used to meet every Monday.", "a": ["We used to meet every Monday"]}, {"say": "You'll get used to it soon.", "a": ["You'll get used to it soon", "You will get used to it soon"]}]}], "ux": [{"id": "p1-d2-u1", "type": "lesson", "title": "Как презентовать макет", "minutes": 5, "body": ["Хорошая презентация макета звучит как рассказ: цель → что сделано → почему так → где нужна помощь.", "Ниже фразы на каждый шаг. Прослушайте их и повторите вслух: интонацию лучше ставить сразу."], "examples": [{"en": "Let me walk you through the new checkout flow.", "ru": "Давайте я покажу новый сценарий оплаты шаг за шагом."}, {"en": "The main goal here is to reduce drop-offs.", "ru": "Главная цель — сократить отток."}, {"en": "I went with cards because they scan better on mobile.", "ru": "Я выбрала карточки, потому что на мобильном их легче просматривать."}, {"en": "One trade-off is that we show less data at once.", "ru": "Компромисс в том, что одновременно видно меньше данных."}, {"en": "I'd love your feedback on the empty states.", "ru": "Мне очень нужен ваш фидбэк по пустым состояниям."}]}, {"id": "p1-d2-u2", "type": "quiz", "title": "Какая фраза подходит?", "minutes": 4, "items": [{"q": "Вы начинаете показ макета на созвоне.", "options": ["Let me walk you through the flow.", "Let me walk you the flow.", "Let me go you through the flow."], "a": 0, "explain": "walk someone through something — провести кого-то по чему-то."}, {"q": "Вы объясняете, почему выбрали вкладки, а не меню.", "options": ["I chose tabs, because reason.", "I went with tabs because they're faster to reach.", "I went to tabs because faster."], "a": 1, "explain": "go with — выбрать вариант. После because нужна полная причина."}, {"q": "Вы честно называете минус решения.", "options": ["One trade-off is that the page gets longer.", "One trade is that the page longer.", "The page is bad, sorry."], "a": 0, "explain": "trade-off — компромисс: что мы теряем ради выигрыша."}, {"q": "Вы просите фидбэк по конкретной части.", "options": ["Give me feedbacks.", "Any feedbacks?", "I'd love your feedback on the onboarding."], "a": 2, "explain": "feedback неисчисляемое: без -s и без a. Конкретная просьба работает лучше общей."}]}, {"id": "p1-d2-u3", "type": "write", "title": "Сообщение в Slack", "minutes": 6, "prompt": "Напишите продакт-менеджеру в Slack: макеты нового онбординга готовы, вы прикрепили ссылку и просите фидбэк до четверга. Отдельно упомяните, что пустые состояния ещё в работе.", "hint": "Используйте: walk you through, I'd love your feedback on, by Thursday, still working on.", "minWords": 30}]}, {"day": 3, "title": "Фразовые глаголы для работы", "general": [{"id": "p1-d3-g1", "type": "cards", "title": "6 фразовых глаголов", "minutes": 5, "cards": ["g7", "g8", "g9", "g10", "g11", "g12"]}, {"id": "p1-d3-g2", "type": "quiz", "title": "Фразовые глаголы: практика", "minutes": 5, "items": [{"q": "The client was ill, so we ___ the meeting.", "options": ["called off", "turned down", "took off"], "a": 0, "explain": "call off — отменить. turn down — отклонить предложение, take off — снять, взлететь."}, {"q": "I keep ___ my portfolio update. I should start today.", "options": ["putting on", "putting off", "putting out"], "a": 1, "explain": "put off — откладывать."}, {"q": "Our team ___ a great name for the new feature.", "options": ["came up with", "came over", "came across"], "a": 0, "explain": "come up with — придумать. come across — случайно наткнуться."}, {"q": "I can't ___ why the grid breaks on tablets.", "options": ["find up", "figure out", "point out"], "a": 1, "explain": "figure out — разобраться."}, {"q": "Thanks for ___ that typo in the header!", "options": ["pointing out", "calling off", "carrying on"], "a": 0, "explain": "point out — указать на что-то."}, {"q": "Sorry for interrupting. Please ___.", "options": ["put off", "carry on", "come up"], "a": 1, "explain": "carry on — продолжайте."}]}, {"id": "p1-d3-g3", "type": "quiz", "title": "Аудирование: что имелось в виду?", "minutes": 4, "items": [{"say": "We had to put off the launch until March.", "q": "Что случилось с запуском?", "options": ["Его отменили", "Его отложили до марта", "Его провели в марте досрочно"], "a": 1, "explain": "put off — отложить."}, {"say": "Can you figure out why the button doesn't work?", "q": "О чём просят?", "options": ["Разобраться, почему не работает кнопка", "Убрать кнопку", "Нарисовать новую кнопку"], "a": 0, "explain": "figure out — разобраться."}, {"say": "She came up with a much simpler flow.", "q": "Что сделала коллега?", "options": ["Нашла ошибку в сценарии", "Отказалась от сценария", "Придумала более простой сценарий"], "a": 2, "explain": "come up with — придумать."}, {"say": "Sorry to interrupt, please carry on.", "q": "Что просит говорящий?", "options": ["Подождать", "Продолжать", "Повторить"], "a": 1, "explain": "carry on — продолжать."}]}], "ux": [{"id": "p1-d3-u1", "type": "lesson", "title": "Давать и принимать фидбэк", "minutes": 5, "body": ["На ревью важно звучать уверенно, но не резко. В английском критику смягчают вопросами и фразами «I'm not sure about…».", "Когда критикуют вас, сначала признайте мысль, потом уточните, потом ответьте или возьмите время."], "examples": [{"en": "I like how clear the navigation is.", "ru": "Мне нравится, насколько понятная навигация."}, {"en": "Have you considered a bottom sheet here?", "ru": "Вы не думали сделать здесь нижнюю шторку?"}, {"en": "I'm not sure about the colour of the main button.", "ru": "Я не уверена насчёт цвета главной кнопки."}, {"en": "That's a fair point.", "ru": "Справедливое замечание."}, {"en": "Could you say more about that?", "ru": "Можете рассказать подробнее?"}, {"en": "Let me think about it and follow up tomorrow.", "ru": "Дайте мне подумать, вернусь с ответом завтра."}]}, {"id": "p1-d3-u2", "type": "dialog", "title": "Диалог: разработчик против анимаций", "minutes": 8, "lines": [{"s": "Developer", "t": "I've looked at the new onboarding. The animations look great, but they'll take about two weeks to build."}, {"s": "Designer", "t": "That's a fair point. Could you say more about which part is the hardest?"}, {"s": "Developer", "t": "Mostly the card transitions. What if we use a simple fade for the first release?"}, {"s": "Designer", "t": "I see. The rationale for the transitions was to show progress, but a progress bar could do the same job. Let me think about it and follow up tomorrow."}], "items": [{"q": "What is the developer's concern?", "options": ["The animations look bad", "The animations will take a long time to build", "The onboarding is too long"], "a": 1, "explain": "…they'll take about two weeks to build."}, {"q": "What does the developer suggest?", "options": ["A simple fade for the first release", "Removing the onboarding", "A progress bar"], "a": 0, "explain": "What if we use a simple fade for the first release?"}, {"q": "What will the designer do?", "options": ["Agree immediately", "Ask the PM", "Think and reply tomorrow"], "a": 2, "explain": "Let me think about it and follow up tomorrow."}]}]}, {"day": 4, "title": "wish и деловые письма", "general": [{"id": "p1-d4-g1", "type": "lesson", "title": "wish: сожаление о настоящем и прошлом", "minutes": 6, "body": ["**wish + Past Simple** — жалею о том, что сейчас: I wish I had more time (жаль, что у меня нет времени). С to be часто were: I wish it were Friday.", "**wish + Past Perfect** — жалею о прошлом: I wish I had studied harder (жаль, что я не училась усерднее).", "**wish + could** — не хватает умения сейчас: I wish I could speak fluently.", "**If only** — то же самое, только эмоциональнее: If only we had tested it earlier!", "Подсказка: смотрите на маркер времени. yesterday, last year, at school → Past Perfect."], "examples": [{"en": "I wish I had more time for English.", "ru": "Жаль, что у меня мало времени на английский."}, {"en": "I wish I hadn't said that.", "ru": "Зря я это сказала."}, {"en": "I wish I could draw like her.", "ru": "Хотела бы я рисовать, как она."}, {"en": "If only we had tested it with users!", "ru": "Если бы мы только протестировали это на пользователях!"}]}, {"id": "p1-d4-g2", "type": "gap", "title": "Впишите форму после wish", "minutes": 6, "items": [{"q": "I wish I ___ (have) more time now.", "a": ["had"], "explain": "Настоящее → Past Simple."}, {"q": "I wish I ___ (study) harder at school.", "a": ["had studied"], "explain": "Прошлое (at school) → Past Perfect."}, {"q": "She wishes she ___ (not / say) that yesterday.", "a": ["hadn't said", "had not said"], "explain": "yesterday → Past Perfect, отрицание hadn't."}, {"q": "I wish I ___ (can) speak English fluently.", "a": ["could"], "explain": "can → could после wish."}, {"q": "If only we ___ (test) the design before the launch.", "a": ["had tested"], "explain": "Сожаление о прошлом → Past Perfect."}, {"q": "I wish it ___ (not / be) so cold today.", "a": ["wasn't", "weren't", "was not", "were not"], "explain": "Настоящее → Past Simple. Weren't — более формальный вариант."}]}, {"id": "p1-d4-g3", "type": "write", "title": "Три сожаления", "minutes": 4, "prompt": "Напишите 3 предложения о себе: одно с wish + Past Simple (о настоящем) и два с wish + Past Perfect (о прошлом).", "hint": "Например: I wish I had… / I wish I had learnt… / If only I hadn't…", "minWords": 15}], "ux": [{"id": "p1-d4-u1", "type": "cards", "title": "Слова для созвонов и писем", "minutes": 5, "cards": ["u7", "u8", "u9", "u10", "u11", "u12"]}, {"id": "p1-d4-u2", "type": "quiz", "title": "Фразы для писем клиенту", "minutes": 4, "items": [{"q": "Клиент не ответил на прошлое письмо. Вы мягко напоминаете.", "options": ["Why don't you answer?", "Just following up on my email from Monday.", "I wait your answer."], "a": 1, "explain": "follow up on — вежливо вернуться к вопросу."}, {"q": "Вы хотите договориться о составе работ.", "options": ["Could we align on the scope this week?", "We must agree the scope now.", "Scope, please."], "a": 0, "explain": "align on — прийти к общему пониманию."}, {"q": "Вы прикладываете файл.", "options": ["In attach is the file.", "I attached you the file.", "I've attached the updated mockups."], "a": 2, "explain": "I've attached… — естественно и коротко. Please find attached звучит формальнее, но тоже верно."}, {"q": "Вы заканчиваете письмо.", "options": ["Waiting for answer.", "Looking forward to hearing from you.", "Answer me soon."], "a": 1, "explain": "Стандартная вежливая концовка."}]}, {"id": "p1-d4-u3", "type": "write", "title": "Письмо-напоминание клиенту", "minutes": 7, "prompt": "Клиент неделю назад обещал прислать тексты для сайта, и без них вы не можете закончить макеты. Напишите вежливое письмо-напоминание: напомните о текстах, объясните, что от них зависит, и предложите созвон, чтобы согласовать сроки.", "hint": "Используйте: following up on, deliverable, align on, looking forward to hearing from you.", "minWords": 40}]}, {"day": 5, "title": "Слова-двойники и собеседование", "general": [{"id": "p1-d5-g1", "type": "cards", "title": "Слова-двойники B2", "minutes": 5, "cards": ["g13", "g14", "g15", "g16", "g17", "g18"]}, {"id": "p1-d5-g2", "type": "quiz", "title": "Не перепутайте", "minutes": 4, "items": [{"q": "Her argument was so ___ that everyone agreed.", "options": ["compulsory", "compelling", "complimentary"], "a": 1, "explain": "compelling — убедительный."}, {"q": "English classes are ___ for all students.", "options": ["compulsory", "compelling", "sensible"], "a": 0, "explain": "compulsory — обязательный."}, {"q": "Buying a cheaper laptop was a ___ decision.", "options": ["sensitive", "sensible", "eventual"], "a": 1, "explain": "sensible — разумный. Ложный друг: не «сенситивный»."}, {"q": "Be careful, it's a ___ topic for him.", "options": ["sensible", "actual", "sensitive"], "a": 2, "explain": "sensitive — деликатный, болезненный."}, {"q": "We ___ found the bug after three days.", "options": ["eventually", "actually", "possibly"], "a": 0, "explain": "eventually — в конце концов. Ложный друг: не «возможно»."}, {"q": "___, the meeting is tomorrow, not today.", "options": ["Eventually", "Actually", "Actual"], "a": 1, "explain": "actually — на самом деле. Ложный друг: не «актуально»."}]}, {"id": "p1-d5-g3", "type": "quiz", "title": "Мини-проверка недели", "minutes": 5, "items": [{"q": "I'm sorry, I ___ a mistake in the report.", "options": ["did", "made", "had"], "a": 1, "explain": "make a mistake."}, {"q": "I'm used to ___ in English now.", "options": ["write", "wrote", "writing"], "a": 2, "explain": "be used to + -ing."}, {"q": "I wish I ___ that job offer last year.", "options": ["accepted", "had accepted", "would accept"], "a": 1, "explain": "last year → wish + Past Perfect."}, {"q": "The conference was ___ because of the storm.", "options": ["called off", "put on", "figured out"], "a": 0, "explain": "call off — отменить."}, {"q": "We ___ have remote days, but now we do.", "options": ["didn't use to", "weren't used to", "didn't used to"], "a": 0, "explain": "Привычка в прошлом: didn't use to + глагол."}, {"q": "Can you ___ me a favour?", "options": ["make", "do", "give"], "a": 1, "explain": "do someone a favour."}]}], "ux": [{"id": "p1-d5-u1", "type": "lesson", "title": "Tell me about yourself", "minutes": 5, "body": ["Самый частый первый вопрос на собеседовании. Удобная схема: **настоящее → прошлое → будущее**, около минуты.", "Настоящее: кто вы и чем занимаетесь сейчас. Прошлое: 1–2 проекта с результатом. Будущее: почему вам интересна именно эта роль.", "Говорите глаголами действия: I led, I designed, I tested, I improved. И давайте цифры, если они есть."], "examples": [{"en": "I'm a UX/UI designer with a focus on dashboards and web products.", "ru": "Я UX/UI дизайнер, специализируюсь на дашбордах и веб-продуктах."}, {"en": "Recently I designed a dashboard that collects messages from several channels.", "ru": "Недавно я спроектировала дашборд, который собирает сообщения из нескольких каналов."}, {"en": "I'm looking for a team where research is part of the process.", "ru": "Я ищу команду, где исследования — часть процесса."}]}, {"id": "p1-d5-u2", "type": "dialog", "title": "Диалог: собеседование", "minutes": 7, "lines": [{"s": "Interviewer", "t": "So, can you tell me a bit about your design process?"}, {"s": "Candidate", "t": "Sure. I usually start with research. I talk to users and stakeholders to understand their pain points."}, {"s": "Interviewer", "t": "And what happens after that?"}, {"s": "Candidate", "t": "Then I make low-fidelity wireframes and test them early. It's much cheaper to change a wireframe than a finished screen."}, {"s": "Interviewer", "t": "How do you handle disagreements with developers?"}, {"s": "Candidate", "t": "I explain my rationale and listen to theirs. Usually we find a trade-off that works for both the users and the team."}], "items": [{"q": "How does the candidate start a project?", "options": ["With high-fidelity mockups", "With research", "With a meeting with developers"], "a": 1, "explain": "I usually start with research."}, {"q": "Why does she test wireframes early?", "options": ["Users prefer wireframes", "Stakeholders ask for it", "Changes are cheaper at that stage"], "a": 2, "explain": "It's much cheaper to change a wireframe than a finished screen."}, {"q": "How does she handle disagreements?", "options": ["She explains her reasons and looks for a compromise", "She asks her manager to decide", "She always follows the developers"], "a": 0, "explain": "I explain my rationale… we find a trade-off."}]}, {"id": "p1-d5-u3", "type": "write", "title": "Ваш ответ: Tell me about yourself", "minutes": 8, "prompt": "Напишите свой ответ на «Tell me about yourself» для собеседования на позицию UX/UI дизайнера: 60–80 слов, по схеме настоящее → прошлое → будущее. Пришлите его в экспорте — проверю по критериям CEFR и подскажу, как звучать естественнее.", "hint": "I'm a… / Recently I… / I'm looking for…", "minWords": 60}]}]}</script>
<script type="application/json" id="seed-test">{"type": "level-test", "id": "level-v1", "version": 1, "title": "Проверка уровня · версия 1", "created": "2026-10-30", "skills": {"grammar": {"title": "Грамматика и лексика", "minutes": 12, "about": "20 вопросов от A2 до C1, сложность растёт. Если не знаете ответа, не угадывайте — выберите наугад только если есть мысль.", "parts": [{"title": "Выберите правильный вариант", "items": [{"q": "We ___ to the cinema last weekend.", "options": ["go", "went", "have gone"], "a": 1, "band": "A2"}, {"q": "There isn't ___ milk in the fridge.", "options": ["many", "some", "much"], "a": 2, "band": "A2"}, {"q": "Anna is ___ than her sister.", "options": ["taller", "more tall", "tallest"], "a": 0, "band": "A2"}, {"q": "It's dark in here. Can you turn ___ the light?", "options": ["on", "in", "up"], "a": 0, "band": "A2"}, {"q": "My train ___ at 7 a.m. tomorrow.", "options": ["leave", "leaves", "leaving"], "a": 1, "band": "A2"}, {"q": "I've worked at this company ___ three years.", "options": ["since", "for", "during"], "a": 1, "band": "B1"}, {"q": "If it rains tomorrow, we ___ at home.", "options": ["stay", "will stay", "would stay"], "a": 1, "band": "B1"}, {"q": "The report ___ by the manager yesterday.", "options": ["was written", "wrote", "has written"], "a": 0, "band": "B1"}, {"q": "I'm looking forward to ___ from you.", "options": ["hear", "hearing", "heard"], "a": 1, "band": "B1"}, {"q": "She asked me where ___.", "options": ["I lived", "did I live", "do I live"], "a": 0, "band": "B1"}, {"q": "I'd rather you ___ this to anyone yet.", "options": ["don't mention", "didn't mention", "not mention"], "a": 1, "band": "B2"}, {"q": "By next June, I ___ here for ten years.", "options": ["will work", "will have worked", "am working"], "a": 1, "band": "B2"}, {"q": "The new rules will ___ effect from Monday.", "options": ["take", "make", "have"], "a": 0, "band": "B2"}, {"q": "She ___ the job offer because the salary was too low.", "options": ["turned down", "turned up", "turned over"], "a": 0, "band": "B2"}, {"q": "It's high time we ___ the project.", "options": ["start", "started", "will start"], "a": 1, "band": "B2"}, {"q": "Not only ___ late, but he also forgot the slides.", "options": ["he was", "was he", "he has been"], "a": 1, "band": "C1"}, {"q": "Had I known about the delay, I ___ a later train.", "options": ["would take", "would have taken", "took"], "a": 1, "band": "C1"}, {"q": "The proposal was rejected, ___ was hardly surprising.", "options": ["that", "which", "what"], "a": 1, "band": "C1"}, {"q": "The results were ___: they could be read in two different ways.", "options": ["ambiguous", "ambitious", "ambient"], "a": 0, "band": "C1"}, {"q": "The company ___ its losses on the weak market.", "options": ["blamed", "accused", "charged"], "a": 0, "band": "C1"}]}]}, "reading": {"title": "Чтение", "minutes": 15, "about": "3 текста разной сложности, по 4 вопроса к каждому. Можно перечитывать текст сколько угодно.", "parts": [{"title": "Текст 1 · Сообщение в рабочем чате", "passage": "Hi everyone,\n\nFrom Monday 9 November the office on the third floor will be closed for repairs for two weeks. During this time, the design team will work on the fifth floor, in the meeting room next to the kitchen.\n\nPlease take your laptops home on Friday evening — there will be no space to leave them. The coffee machine on the fifth floor is broken, but a new one will arrive on Tuesday.\n\nIf you would rather work from home during the repairs, tell your manager by Thursday.\n\nThanks,\nMarta", "items": [{"q": "How long will the repairs take?", "options": ["One week", "Two weeks", "Until Tuesday"], "a": 1, "band": "A2"}, {"q": "Where will the design team work?", "options": ["On the third floor", "In a meeting room on the fifth floor", "Only from home"], "a": 1, "band": "A2"}, {"q": "What should people do on Friday evening?", "options": ["Take their laptops home", "Tell their manager", "Buy a new coffee machine"], "a": 0, "band": "B1"}, {"q": "Working from home during the repairs is…", "options": ["required for everyone", "not allowed", "possible if you tell your manager by Thursday"], "a": 2, "band": "B1"}]}, {"title": "Текст 2 · Статья о дизайнере", "passage": "When Lena started her first job as a product designer, she avoided talking to developers. She was worried they would ask technical questions she couldn't answer.\n\nAfter a difficult project in which several of her screens had to be redesigned at the last minute, she decided to change her approach. She didn't try to become a programmer; instead, she spent an hour a week learning the basics of how web pages are built.\n\nWithin a few months, she noticed that her conversations with developers had become shorter and more productive. She could predict which ideas would be expensive to build and suggest simpler alternatives early.\n\n\"The biggest change wasn't technical,\" she says. \"It was that developers started inviting me to their planning meetings.\" Today Lena recommends that every junior designer spend a little time on the basics — not to write code, but to understand the people who do.", "items": [{"q": "Why did Lena avoid developers at first?", "options": ["She didn't like them", "She was afraid of technical questions", "She was too busy"], "a": 1, "band": "B1"}, {"q": "What made her change her approach?", "options": ["A project where screens had to be redone late", "Advice from her manager", "A course she took"], "a": 0, "band": "B1"}, {"q": "What was her main aim in learning the basics?", "options": ["To become a developer", "To understand how web pages are built", "To find a better job"], "a": 1, "band": "B2"}, {"q": "According to Lena, the most important result was that…", "options": ["she started writing code", "developers began to include her in planning", "she had fewer meetings"], "a": 1, "band": "B2"}]}, {"title": "Текст 3 · Статья о концентрации", "passage": "Most people believe that they are good at multitasking, but research suggests otherwise. What we call multitasking is usually rapid switching between tasks, and every switch carries a cost: it takes time for the brain to fully re-engage with the previous task.\n\nFor short, routine activities this cost is barely noticeable. For complex work, such as writing or designing, it can add up to a significant loss of time and quality.\n\nInterestingly, the problem is not only the interruptions themselves but the expectation of them. Some studies suggest that people perform worse when they merely know a message might arrive, even if it never does.\n\nThis has led some companies to experiment with \"quiet hours\" — fixed periods when no meetings are scheduled and chat notifications are paused. Early results are encouraging, although critics point out that such policies only work if managers follow them too; otherwise, employees feel they must stay available anyway.", "items": [{"q": "What does the writer say about multitasking?", "options": ["It is mostly switching quickly between tasks", "It improves the quality of work", "Most people are good at it"], "a": 0, "band": "B2"}, {"q": "The cost of switching is most serious for…", "options": ["routine tasks", "complex tasks such as writing", "short meetings"], "a": 1, "band": "B2"}, {"q": "According to the text, performance can drop when people…", "options": ["receive too many messages", "only expect that a message may arrive", "switch off notifications"], "a": 1, "band": "C1"}, {"q": "What is the critics' point about quiet hours?", "options": ["They are too expensive", "They only work if managers respect them as well", "They reduce communication in teams"], "a": 1, "band": "C1"}]}]}, "listening": {"title": "Аудирование", "minutes": 12, "about": "3 части: короткие фразы, диалог, выступление. Слушайте сколько угодно раз, но не открывайте текст — его нет.", "parts": [{"title": "Часть 1 · Короткие фразы", "items": [{"say": "The meeting has been moved from Tuesday to Thursday afternoon.", "q": "When is the meeting now?", "options": ["Tuesday afternoon", "Thursday morning", "Thursday afternoon"], "a": 2, "band": "A2"}, {"say": "Could you send me the file by five? I need to check it before I leave.", "q": "Why does the speaker need the file by five?", "options": ["To check it before leaving", "To send it to a client", "To print it"], "a": 0, "band": "A2"}, {"say": "I'd love to come, but I've already promised to help my brother move house.", "q": "Will the speaker come?", "options": ["Yes, definitely", "No, because of another plan", "Yes, but later"], "a": 1, "band": "B1"}, {"say": "The new version looks great, although the buttons are a bit hard to see on mobile.", "q": "What is the problem with the new version?", "options": ["The colours", "The buttons are hard to see on mobile", "It is too slow"], "a": 1, "band": "B1"}]}, {"title": "Часть 2 · Созвон с клиентом", "lines": [{"s": "Client", "t": "Hi, thanks for joining. I've had a look at the homepage designs. Overall, we really like the direction."}, {"s": "Designer", "t": "Great to hear. Is there anything you'd like to change?"}, {"s": "Client", "t": "Just one thing. Our sales team feels the pricing section is too far down the page. They'd like people to see it earlier."}, {"s": "Designer", "t": "That makes sense. I can move it up, but then the customer stories would drop below it. Is that okay?"}, {"s": "Client", "t": "Yes, that's fine. The stories are nice, but pricing is what people ask about first."}, {"s": "Designer", "t": "Okay. I'll send an updated version on Wednesday, and if you approve it, we can hand it off to development on Friday."}], "items": [{"q": "What does the client think of the designs overall?", "options": ["They like them", "They are not happy", "They haven't seen them yet"], "a": 0, "band": "B1"}, {"q": "Who wants the pricing section moved?", "options": ["The designer", "The sales team", "The developers"], "a": 1, "band": "B1"}, {"q": "What will happen to the customer stories?", "options": ["They will be removed", "They will appear below the pricing", "They will move to a separate page"], "a": 1, "band": "B2"}, {"q": "When could the design go to development?", "options": ["On Wednesday", "On Friday, if the client approves it", "Next week"], "a": 1, "band": "B2"}]}, {"title": "Часть 3 · Выступление на встрече", "lines": [{"s": "Speaker", "t": "Good morning, everyone. Today I want to talk about why accessibility should be part of our process from the very beginning, rather than something we check at the end."}, {"s": "Speaker", "t": "When accessibility is left until the last stage, fixing problems usually means redesigning components that are already built, which is slow and expensive. By contrast, if we choose accessible colour combinations and clear focus states while we're still sketching, the extra effort is minimal."}, {"s": "Speaker", "t": "There's also a common misconception that accessible design only benefits a small group of users. In reality, features like larger tap targets and good contrast help everyone — for example, someone using their phone in bright sunlight."}, {"s": "Speaker", "t": "So my proposal is simple: we add three accessibility questions to every design review, starting next sprint."}], "items": [{"q": "What is the main purpose of the talk?", "options": ["To suggest including accessibility early in the process", "To report on a finished project", "To train developers"], "a": 0, "band": "B2"}, {"q": "Why is late accessibility work a problem?", "options": ["Built components have to be redesigned, which is slow and costly", "Users complain about it", "It is not allowed in most companies"], "a": 0, "band": "B2"}, {"q": "The speaker mentions bright sunlight to show that…", "options": ["accessible features help everyone", "phones have technical problems", "many users work outdoors"], "a": 0, "band": "C1"}, {"q": "What exactly does the speaker propose?", "options": ["Creating a new accessibility team", "Adding three accessibility questions to every design review", "Postponing the next sprint"], "a": 1, "band": "C1"}]}]}, "writing": {"title": "Письмо", "minutes": 35, "about": "2 задания. Оценивает Claude по критериям CEFR: содержание, достижение цели, организация текста, язык. Результат придёт в следующем пакете.", "parts": [{"title": "Задание 1 · Письмо коллеге (B1)", "prompt": "Your colleague Sam is joining your team next week. Write an email to Sam (80–100 words):\n• welcome Sam to the team;\n• explain what your team is working on now;\n• suggest when and where you could meet in the first week.", "minWords": 70}, {"title": "Задание 2 · Эссе-мнение (B2)", "prompt": "Some people think that working from home makes teams less creative. Write an essay (140–190 words) giving your opinion. Support it with reasons and examples from your own experience.", "minWords": 120}]}, "speaking": {"title": "Говорение", "minutes": 10, "about": "Ответьте вслух на 3 вопроса, около минуты на каждый. Потом честно отметьте, что у вас получилось — уровень посчитается по этой самооценке.", "prompts": [{"t": "Talk about your job. What do you do, what do you like about it, and what is difficult?", "band": "B1"}, {"t": "Describe a project you are proud of. What was the problem, what did you do, and what was the result?", "band": "B2"}, {"t": "Some people say AI tools will replace designers. Do you agree? Give reasons and examples.", "band": "C1"}], "descriptors": [{"band": "A2", "t": "Я могу простыми фразами рассказать о своей работе и дне."}, {"band": "A2", "t": "Я могу задать и ответить на простые вопросы на знакомые темы."}, {"band": "A2", "t": "Я могу сказать, что мне нравится и что нет."}, {"band": "B1", "t": "Я могу рассказать о прошлом проекте, связывая события словами then, because, so."}, {"band": "B1", "t": "Я могу высказать мнение и объяснить его простыми причинами."}, {"band": "B1", "t": "Я справляюсь с обычным рабочим разговором, хотя иногда подбираю слова."}, {"band": "B2", "t": "Я могу const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const BANDS = ['A2', 'B1', 'B2', 'C1'];
function currentTest() { return S.tests.slice().sort((a, b) => (b.version || 0) - (a.version || 0))[0]; }
function latestResult(skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const r = S.checks[i].results[skill]; if (r) return Object.assign({ date: S.checks[i].date, test: S.checks[i].test }, r); } return null; }
function latestLevel(skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const r = S.checks[i].results[skill]; if (r && r.level) return r; } return null; }
function doneInTest(testId, skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const c = S.checks[i]; if (c.test === testId && c.results[skill]) return Object.assign({ date: c.date }, c.results[skill]); } return null; }
function overallLevel() {
  const ls = SKILLS.map(k => latestLevel(k)).filter(Boolean).map(r => LEVELS.indexOf(r.level)).filter(i => i >= 0);
  if (!ls.length) return { level: 'B1', n: 0 };
  return { level: LEVELS[Math.floor(ls.reduce((a, b) => a + b, 0) / ls.length)], n: ls.length };
}
function levelFromBands(b) {
  let lvl = 'A1';
  for (const band of BANDS) {
    const x = b[band]; if (!x || !x.t) continue;
    const pass = x.t <= 2 ? x.c >= 1 : x.c / x.t >= 0.6;
    if (pass) lvl = band; else break;
  }
  return lvl;
}
function checkKind(c) {

}
function skillMinutes(t, k) { return (t.skills[k] && t.skills[k].minutes) || 10; }

function checkSteps(sk) { const out = []; (sk.parts || []).forEach((p, pi) => (p.items || []).forEach((it, ii) => out.push({ p, it, pi, ii }))); return out; }
function startCheck(skill) { const t = currentTest(); CS = { skill, test: t.id, started: false, i: 0, answers: [], drafts: [], ticks: {}, phase: 0, result: null }; }
function vCheck(skill) {
  const t = currentTest(), sk = t.skills[skill];
  if (!CS || CS.skill !== skill || CS.test !== t.id) startCheck(skill);
  const title = skillName(skill);
  if (!CS.started) return { title, back: true, body: checkIntro(t, skill, sk) };
  if (CS.result) return { title, back: true, body: checkResult(skill, sk) };
  if (skill === 'writing') return { title, back: true, body: checkWriting(sk) };
  if (skill === 'speaking') return { title, back: true, body: checkSpeaking(sk) };
  return { title, back: true, body: checkChoice(skill, sk) };
}
function checkIntro(t, skill, sk) {
  const d = doneInTest(t.id, skill);
  const n = skill === 'writing' ? sk.parts.length : skill === 'speaking' ? sk.prompts.length : checkSteps(sk).length;
  const unit = skill === 'writing' ? P(n, 'задание', 'задания', 'заданий', 'task', 'tasks') : skill === 'speaking' ? P(n, 'вопрос', 'вопроса', 'вопросов', 'prompt', 'prompts') : P(n, 'вопрос', 'вопроса', 'вопросов', 'question', 'questions');
  let h = `<div class="tmeta"><span class="pill" style="background:${SKILL_UI[skill].color};color:#fff">${L('CEFR A2–C1', 'CEFR A2–C1')}</span><span class="pill">${mins(sk.minutes)}</span><span class="pill">${n} ${unit}</span><span class="pill">${L('версия', 'version')} ${t.version}</span></div>`;
  if (d) h += `<div class="notice">${IC.check}<span><b>${L('Вы уже проходили эту версию', 'You have taken this version')} ${fmtShort(d.date)}${d.level ? ' · ' + d.level : d.pending ? L(' · на проверке', ' · pending') : ''}.</b> ${L('Новую версию теста Claude выложит к следующей контрольной, она загрузится сама. Повторное прохождение этой версии даст завышенный результат: вопросы уже знакомы.', 'Claude will publish a new version for the next full check, and it will load automatically. Retaking this version gives an inflated result: you have seen the questions.')}</span></div>`;
  h += `<div class="panel"><p class="prompt" style="margin:0">${md(sk.about)}</p></div>`;
  h += `<div class="actions"><button class="btn" data-act="check-start">${d ? L('Пройти ещё раз', 'Take again') : L('Начать', 'Start')}</button></div>`;
  return h;
}
function checkChoice(skill, sk) {
  const steps = checkSteps(sk), st = steps[CS.i], it = st.it, p = st.p, sel = CS.answers[CS.i];
  let h = `<div class="progress"><i style="width:${(CS.i / steps.length) * 100}%"></i></div>`;

  if (el) el.textContent = '1:00';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'scrim') { if (e.target === el) { UI.sheet = null; renderSheet(); } return; }
  switch (a) {
    case 'tab': go(() => { UI.tab = el.dataset.tab; UI.stack = []; UI.viewDay = null; UI.resetAsk = false; }); break;
    case 'back': try { speechSynthesis.cancel(); } catch (er) {} clearInterval(timerT); go(() => { const top = UI.stack.pop(); if (top && top.v === 'task') TS = null; if (top && top.v === 'review') RV = null; if (top && top.v === 'check') CS = null; }); break;
    case 'day': go(() => { UI.viewDay = Number(el.dataset.d); }); break;
    case 'open-task': go(() => startTask(el.dataset.id)); break;
    case 'open-section': go(() => UI.stack.push({ v: 'section', sec: el.dataset.sec })); break;
    case 'open-show': go(() => { UI.seg = 'words'; UI.stack.push({ v: 'show', id: el.dataset.id }); }); break;
    case 'open-review': go(() => { RV = null; UI.stack.push({ v: 'review' }); }); break;
    case 'open-checks': go(() => UI.stack.push({ v: 'checks' })); break;
    case 'open-check': go(() => { CS = null; UI.stack.push({ v: 'check', skill: el.dataset.skill }); }); break;
    case 'check-start': CS.started = true; CS.i = 0; CS.answers = []; go(() => {}); break;
    case 'check-pick': CS.answers[CS.i] = Number(el.dataset.i); render(); break;
    case 'check-prev': CS.i = Math.max(0, CS.i - 1); go(() => {}); break;
    case 'check-next': {
      const sk = currentTest().skills[CS.skill], n = checkSteps(sk).length;
      try { speechSynthesis.cancel(); } catch (er) {}
      if (CS.i >= n - 1) finishChoice(CS.skill, sk); else CS.i++;
      go(() => {}); break;
    }
    case 'check-dialog': { const sk = currentTest().skills[CS.skill], st = checkSteps(sk)[CS.i]; speakDialog(st.p.lines, !!el.dataset.slow); break; }
    case 'check-submit-writing': {
      const sk = currentTest().skills.writing;
      const answers = sk.parts.map((p, i) => ({ task: p.title, text: CS.drafts[i] || '', words: words(CS.drafts[i]) }));
      const res = { pending: true, answers };
      S.checks.push({ id: 'chk-' + uid(), date: today(), kind: 'skill', test: CS.test, results: { writing: res } });
      touchActivity(); save(); CS.result = res; go(() => {}); break;
    }
    case 'timer': runTimer(el.dataset.i); break;
    case 'speak-next': clearInterval(timerT); try { speechSynthesis.cancel(); } catch (er) {} CS.phase = 1; go(() => {}); break;
    case 'speak-back': CS.phase = 0; go(() => {}); break;
    case 'check-submit-speaking': {
      const sk = currentTest().skills.speaking, bands = {};
      sk.descriptors.forEach((d, i) => { bands[d.band] = bands[d.band] || { c: 0, t: 0 }; bands[d.band].t++; if (CS.ticks[i]) bands[d.band].c++; });
      let level = 'A1';
      for (const b of BANDS) { const x = bands[b]; if (x && x.c >= 2) level = b; else break; }
      const ticked = Object.keys(CS.ticks).filter(k => CS.ticks[k]).length;
      const res = { level, score: ticked, total: sk.descriptors.length, bands, self: true };
      S.checks.push({ id: 'chk-' + uid(), date: today(), kind: 'skill', test: CS.test, results: { speaking: res } });
      touchActivity(); save(); CS.result = res; go(() => {}); break;
    }
    case 'speak': speak(el.dataset.text, { slow: !!el.dataset.slow }); break;
    case 'play-dialog': { const x = findTask(TS.id); speakDialog(x.task.lines, !!el.dataset.slow); break; }
    case 'toggle-text': TS.showText = !TS.showText; render(); break;
    case 'pick': { const it = findTask(TS.id).task.items[TS.i]; TS.picked = Number(el.dataset.i); TS.results[TS.i] = TS.picked === it.a; render(); break; }
    case 'check': {
      const it = findTask(TS.id).task.items[TS.i]; const v = (document.getElementById('gap-input') || {}).value || '';
      if (!v.trim()) { toast(L('Сначала впишите ответ', 'Type an answer first')); return; }
      TS.input = v; TS.checked = true; TS.ok = it.a.some(ans => norm(ans) === norm(v)); TS.results[TS.i] = TS.ok; render(); break;
    }
    case 'next': {
      const t = findTask(TS.id).task;
      if (TS.i >= t.items.length - 1) { TS.finished = true; const sc = TS.results.filter(Boolean).length; markDone(t.id, { score: sc, total: t.items.length }); S.progress[t.id].score = sc; save(); }
      else { TS.i++; TS.picked = null; TS.checked = false; TS.input = ''; }
      render(); window.scrollTo(0, 0); break;
    }
    case 'retry': { const id = TS.id; TS = null; startTask(id); UI.stack.pop(); render(); break; }
    case 'lesson-done': markDone(TS.id); go(() => { UI.stack.pop(); TS = null; }); toast(L('Урок пройден', 'Lesson done')); break;
    case 'flip': TS.flipped = !TS.flipped; render(); break;
    case 'card-next': {
      const t = findTask(TS.id).task;
      if (TS.i >= t.cards.length - 1) { addCards(t.cards); markDone(t.id); TS.finished = true; }
      else { TS.i++; TS.flipped = false; }
      render(); break;
    }
    case 'save-write': { const t = findTask(TS.id).task; markDone(t.id, { answer: TS.draft, words: words(TS.draft) }); S.progress[t.id].answer = TS.draft; save(); toast(L('Сохранено — попадёт в экспорт', 'Saved — it goes into your export')); render(); break; }
    case 'rv-flip': RV.flipped = !RV.flipped; render(); break;
    case 'rv': {
      const id = RV.queue[RV.i], c = S.cards[id], ok = el.dataset.ok === '1';
      if (ok) { c.box = Math.min(5, c.box + 1); RV.known++; } else { c.box = 1; c.lapses = (c.lapses || 0) + 1; }
      c.due = addDays(today(), INTERVALS[c.box]); touchActivity(); save();
      RV.i++; RV.flipped = false; render(); break;
    }
    case 'seg': UI.seg = el.dataset.seg; render(); break;
    case 'add-word': { const top = UI.stack[UI.stack.length - 1]; UI.sheet = { kind: 'add', show: top && top.v === 'show' ? top.id : 'silicon-valley' }; renderSheet(); break; }
    case 'save-word': {
      const text = document.getElementById('aw-text').value.trim(); if (!text) return;
      const ep = (document.getElementById('aw-ep').value.trim() || 'S1E3').toUpperCase(), ctx = document.getElementById('aw-ctx').value.trim();
      const show = UI.sheet.show || 'silicon-valley';
      const dl = UI.awTr && UI.awTr.k === norm(text) ? UI.awTr.ru : '';
      S.myWords.push({ id: 'w-' + uid(), text, ru: dl || lookup(text) || '', src: dl ? 'deepl' : 'dict', show, ep, ctx, at: today() }); UI.awTr = null;
      const sh = S.shows.find(s => s.id === show); if (sh && !(sh.episodes || []).some(x => x.ep === ep)) (sh.episodes = sh.episodes || []).push({ ep, title: '' });
      save(); UI.sheet = null; UI.seg = 'words'; renderSheet(); render(); toast(L('Слово записано', 'Word saved')); break;
    }
    case 'del-word': S.myWords = S.myWords.filter(w => w.id !== el.dataset.id); save(); render(); toast(L('Удалено', 'Deleted')); break;
    case 'watched': { const sh = S.shows.find(s => s.id === UI.stack[UI.stack.length - 1].id); if (!sh.watched.includes(el.dataset.ep)) sh.watched.push(el.dataset.ep); save(); render(); toast(L('Отмечено. Пришлите экспорт Claude', 'Marked. Send Claude an export')); break; }
    case 'sheet-close': UI.sheet = null; renderSheet(); break;
    case 'export': UI.sheet = { kind: 'export' }; renderSheet(); break;
    case 'copy-export': {
      const ta = document.getElementById('exp-text');
      const fallback = () => { ta.focus(); ta.select(); toast(L('Текст выделен — скопируйте его', 'Text selected — copy it')); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast(L('Скопировано', 'Copied')), fallback); } catch (er) { fallback(); }
      break;
    }
    case 'check-packs': checkPacks(false); break;
    case 'tr-test': {
      const inp = document.getElementById('set-trurl'); if (inp) { S.settings.trUrl = inp.value.trim(); save(); }
      if (!S.settings.trUrl) { toast(L('Сначала вставьте адрес переводчика', 'Paste the translator address first')); break; }
      toast(L('Перевожу…', 'Translating…'));
      deeplTranslate('Let me walk you through the new flow.').then(ru => toast('DeepL: ' + ru), er => toast(L('Не работает: ', 'Not working: ') + er.message));
      break;
    }
    case 'download-export': {
      try {
        const txt = document.getElementById('exp-text').value, name = 'study-export-' + today() + '.json';
        const file = typeof File === 'function' ? new File([txt], name, { type: 'application/json' }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); break; }
      } catch (er) {}
      try { const b = new Blob([document.getElementById('exp-text').value], { type: 'application/json' }); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = 'study-export-' + today() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); } catch (er) { toast(L('Не удалось сохранить файл', 'Could not save the file')); }
      break;
    }
    case 'import': UI.sheet = { kind: 'import' }; renderSheet(); break;
    case 'do-import': { const v = document.getElementById('imp-text').value.trim(); if (!v) { toast(L('Выберите файл или вставьте текст', 'Choose a file or paste text')); return; } importData(v); break; }
    case 'import-merge': mergeExport(UI.sheet.draft, false); break;
    case 'import-replace': mergeExport(UI.sheet.draft, true); break;
    case 'set-lang': S.settings.lang = el.dataset.lang; document.documentElement.lang = lang(); save(); render(); break;
    case 'voice-test': { e.stopPropagation(); const prev = S.settings.voiceSlot; S.settings.voiceSlot = el.dataset.slot; speak('Let me walk you through the new onboarding flow.'); S.settings.voiceSlot = prev; break; }
    case 'set-voice': S.settings.voiceSlot = el.dataset.slot; save(); render(); break;
    case 'reset-ask': UI.resetAsk = true; render(); break;
    case 'reset-no': UI.resetAsk = false; render(); break;
    case 'reset-yes': S = initState(); save(); UI.resetAsk = false; TS = null; RV = null; CS = null; render(); toast(L('Прогресс сброшен', 'Progress reset')); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.write) {
    TS.draft = t.value; const task = findTask(TS.id).task, n = words(t.value);
    document.getElementById('wc').textContent = `${n} ${P(n, 'слово', 'слова', 'слов', 'word', 'words')} · ${L('минимум', 'minimum')} ${task.minWords}`;
    document.getElementById('save-write').disabled = n < task.minWords;
  }
  if (t.dataset.cw != null && CS) {
    const i = Number(t.dataset.cw), sk = currentTest().skills.writing, n = words(t.value);
    CS.drafts[i] = t.value;
    document.getElementById('cwc-' + i).textContent = `${n} ${P(n, 'слово', 'слова', 'слов', 'word', 'words')} · ${L('минимум', 'minimum')} ${sk.parts[i].minWords}`;
    document.getElementById('cw-submit').disabled = !sk.parts.every((p, k) => words(CS.drafts[k]) >= p.minWords);
  }
  if (t.dataset.aw) { liveTranslate(t.value); document.getElementById('aw-save').disabled = !t.value.trim(); }
  if (t.id === 'set-rate') document.getElementById('rate-val').textContent = Math.round(t.value * 100) + '%';
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = t.type === 'checkbox' ? t.checked : k === 'rate' ? Number(t.value) : t.value; save(); }
  if (t.dataset.tick != null && CS) CS.ticks[t.dataset.tick] = t.checked;
  if (t.id === 'imp-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => importData(String(r.result)); r.readAsText(t.files[0]); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.gap && TS && !TS.checked) { e.preventDefault(); document.querySelector('[data-act="check"]').click(); }
  if (e.key === 'Escape' && UI.sheet) { UI.sheet = null; renderSheet(); }
});
window.addEventListener('scroll', () => {
  const s = window.scrollY > 30; if (s !== UI.scrolled) { UI.scrolled = s; const n = document.getElementById('nav'); if (n) n.classList.toggle('scrolled', s); }
}, { passive: true });

/* ---------- packs and tests from the app's own site ---------- */
async function checkPacks(silent) {
  if (window.self !== window.top) { if (!silent) toast(L('Проверка работает в установленной версии', 'Checking works in the installed app')); return; }
  try {
    const r = await fetch('packs/index.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('index');
    const idx = await r.json();
    const list = [...(idx.packs || []).filter(p => !S.packs.some(x => x.id === p.id)), ...(idx.levelTests || []).filter(p => !S.tests.some(x => x.id === p.id)), ...(idx.results || []).filter(p => !(S.seenResults || []).includes(p.id))];
    const msgs = [];
    for (const p of list) {
      const pr = await fetch('packs/' + p.file, { cache: 'no-store' });
      if (!pr.ok) continue;
      const m = addContent(await pr.json());
      if (idx.results && idx.results.includes(p)) S.seenResults = [...(S.seenResults || []), p.id];
      if (m) msgs.push(m);
    }
    S.lastCheck = today(); save();
    if (msgs.length) { render(); toast(msgs.length === 1 ? msgs[0] : L('Загружено обновлений: ', 'Updates loaded: ') + msgs.length); }
    else if (!silent) { render(); toast(L('Новых заданий пока нет', 'No new tasks yet')); }
  } catch (e) { if (!silent) toast(L('Нет связи с сайтом приложения. Попробуйте позже', 'Cannot reach the app site. Try again later')); }
}
if ('serviceWorker' in navigator && window.self === window.top && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

/* ---------- direct links to screens (for design import: html.to.design etc.) ---------- */
const ROUTES = { lesson: 'p1-d1-g1', cards: 'p1-d1-g2', quiz: 'p1-d1-g3', dialog: 'p1-d1-u2', gap: 'p1-d2-g2', write: 'p1-d2-u3' };
function applyHash() {
  const h = (location.hash || '').slice(1);
  if (!h) return false;
  UI.stack = []; TS = null; RV = null; CS = null; UI.sheet = null;
  if (['today', 'english', 'media', 'progress', 'settings'].includes(h)) UI.tab = h;
  else if (h === 'show') { UI.tab = 'media'; UI.stack.push({ v: 'show', id: 'silicon-valley' }); }
  else if (h === 'review') { UI.tab = 'english'; UI.stack.push({ v: 'review' }); }
  else if (h === 'section') { UI.tab = 'english'; UI.stack.push({ v: 'section', sec: 'general' }); }
  else if (h === 'checks') { UI.tab = 'progress'; UI.stack.push({ v: 'checks' }); }
  else if (h.startsWith('check-') && SKILLS.includes(h.slice(6))) { UI.tab = 'progress'; UI.stack.push({ v: 'check', skill: h.slice(6) }); }
  else if (ROUTES[h]) { UI.tab = 'today'; startTask(ROUTES[h]); }
  else return false;
  render(); renderSheet(); return true;
}
window.addEventListener('hashchange', applyHash);

if (!applyHash()) render();
checkPacks(true);
})();
</script>
