<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Учёба">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Мой учебный план</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: iOS grouped lists on a grouped background; bottom tab bar on phone, sidebar from 900px (macOS). */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --side:#EBEBF0;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --bar:rgba(249,249,249,.86);
  --accent:#5856D6; --accent-soft:rgba(88,86,214,.12);
  --blue:#007AFF; --orange:#FF9500; --pink:#FF2D55; --green:#34C759; --red:#FF3B30; --teal:#30B0C7;
  --green-soft:rgba(52,199,89,.14); --red-soft:rgba(255,59,48,.12);
  /* Spacing & shape tokens (pt). Change here — applies everywhere. */
  --gutter:16px; --section-gap:26px; --head-gap:7px; --block-gap:10px;
  --row-pad-y:11px; --row-pad-x:16px; --row-min:44px; --row-gap:12px; --row-inset:60px;
  --card-pad:16px; --tile-size:30px;
  --radius-group:10px; --radius-card:12px; --radius-tile:7px; --radius-sheet:12px;
  --fs-large:34px; --fs-title:20px; --fs-body:17px; --fs-sub:15px; --fs-foot:13px; --fs-tab:10px;
  --tabbar-h:49px; --nav-h:44px; --tab-pad-top:4px;
  --tab-inactive:#919191;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --side:#161618;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.86);
  --accent:#7D7AFF; --accent-soft:rgba(125,122,255,.18);
  --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F; --green:#30D158; --red:#FF453A; --teal:#40C8E0;
  --green-soft:rgba(48,209,88,.18); --red-soft:rgba(255,69,58,.18);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --side:#161618;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --bar:rgba(22,22,24,.86);
  --accent:#7D7AFF; --accent-soft:rgba(125,122,255,.18);
  --blue:#0A84FF; --orange:#FF9F0A; --pink:#FF375F; --green:#30D158; --red:#FF453A; --teal:#40C8E0;
  --green-soft:rgba(48,209,88,.18); --red-soft:rgba(255,69,58,.18);
  color-scheme:dark}

*{box-sizing:border-box}
html,body,button,a,label,input,select,textarea,[data-act]{touch-action:manipulation}
@media (max-width:899px){input,select,textarea,.code{font-size:16px!important}}
html,body{min-height:100%}
body{background:var(--bg);color:var(--label);font:17px/22px var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
button{font:inherit;color:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0}

/* Sidebar (Mac) */
.sidebar{display:none}
@media (min-width:900px){
  .sidebar{display:flex;flex-direction:column;gap:2px;width:248px;flex:none;position:sticky;top:0;height:100vh;
    background:var(--side);border-right:.5px solid var(--sep);padding:20px 10px 10px max(10px,env(safe-area-inset-left,0px))}
  .side-h{font-size:13px;font-weight:600;color:var(--label2);padding:4px 10px 8px}
  .side-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:15px;cursor:pointer;color:var(--label)}
  .side-i svg{color:var(--accent);width:20px;height:20px}
  .side-i:hover{background:var(--fill)}
  .side-i.on{background:var(--accent);color:#fff}
  .side-i.on svg{color:#fff}
  .tabbar{display:none!important}
  .content{padding-bottom:48px!important}
}

/* Nav bar + large title */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.nav.scrolled,.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.scrolled .nav-t,.nav.solid .nav-t{opacity:1}
.nav-l{justify-self:start}.nav-r{justify-self:end;display:flex;gap:4px}
.nav-btn{display:flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 8px;border:0;background:none;color:var(--accent);cursor:pointer;font-size:17px}
.nav-btn svg{width:22px;height:22px}
.content{max-width:720px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.large{font-size:var(--fs-large);line-height:41px;font-weight:700;letter-spacing:.37px;margin:2px 0 2px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;line-height:20px;margin:0 0 18px;letter-spacing:-.24px}
.sub:first-letter{text-transform:uppercase}

/* Grouped lists */
.ghead{font-size:var(--fs-foot);line-height:18px;text-transform:uppercase;letter-spacing:.2px;color:var(--label2);margin:var(--section-gap) var(--row-pad-x) var(--head-gap);display:flex;align-items:center;gap:8px}
.ghead:first-child{margin-top:8px}
.gfoot{font-size:var(--fs-foot);line-height:18px;color:var(--label2);margin:var(--head-gap) var(--row-pad-x) 0;letter-spacing:-.08px}
.group{background:var(--card);border-radius:var(--radius-group);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--row-gap);width:100%;min-height:var(--row-min);padding:var(--row-pad-y) var(--row-pad-x);background:none;border:0;text-align:left;cursor:pointer;position:relative;color:var(--label)}
button.row:active,a.row:active{background:var(--fill)}
.row+.row::before{content:"";position:absolute;top:0;left:var(--inset,var(--row-pad-x));right:0;height:.5px;background:var(--sep)}
.group.icons .row{--inset:var(--row-inset)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:var(--fs-body);line-height:22px}
.row-sub{font-size:var(--fs-foot);line-height:18px;color:var(--label2);letter-spacing:-.08px}
.row-val{color:var(--label2);font-size:17px;white-space:nowrap}
.row .chev{color:var(--label3);width:14px;height:14px}
.row.static{cursor:default}
.tile{width:var(--tile-size);height:var(--tile-size);border-radius:var(--radius-tile);display:grid;place-items:center;color:#fff;flex:none}
.tile svg{width:18px;height:18px}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:13px;font-weight:600;letter-spacing:-.08px;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.big{height:30px;padding:0 12px;border-radius:15px;font-size:var(--fs-body);font-weight:700;letter-spacing:-.2px}

/* Today header strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--block-gap)}
.stat{background:var(--card);border-radius:var(--radius-card);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:22px;line-height:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stat b svg{width:18px;height:18px;color:var(--orange)}
.stat span{font-size:13px;color:var(--label2);line-height:16px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:var(--section-gap) 0 0;background:var(--card);border-radius:var(--radius-group);padding:4px}
.daybar .nav-btn{min-width:44px;justify-content:center}
.daybar .nav-btn:disabled{color:var(--label3);cursor:default}
.daybar-t{text-align:center;min-width:0}
.daybar-t b{display:block;font-size:15px;font-weight:600}
.daybar-t span{display:block;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:var(--row-gap);width:100%;margin-top:var(--block-gap);padding:14px var(--card-pad);border:0;border-radius:var(--radius-card);background:var(--accent);color:#fff;text-align:left;cursor:pointer}
.banner .row-sub{color:rgba(255,255,255,.8)}
.banner svg.chev{color:rgba(255,255,255,.7);width:14px;height:14px}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0 4px}
.seg button{border:0;background:none;border-radius:7px;height:30px;font-size:13px;font-weight:500;cursor:pointer;color:var(--label)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:var(--card2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--card2)}}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 20px;border:0;border-radius:var(--radius-card);background:var(--accent);color:#fff;font-size:var(--fs-body);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:none;color:var(--accent);font-weight:400;min-height:44px}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btns{display:flex;gap:var(--block-gap);margin-top:var(--card-pad)}
.btns .btn{flex:1}
.actions{display:flex;flex-direction:column;gap:var(--block-gap);margin-top:20px}

/* Task screens */
.tmeta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.progress{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.qcount{font-size:13px;color:var(--label2);margin-top:8px}
.panel{background:var(--card);border-radius:var(--radius-card);padding:var(--card-pad)}
.q{font-size:var(--fs-title);line-height:26px;font-weight:600;letter-spacing:.38px;margin:0 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:12px var(--card-pad);border-radius:var(--radius-card);border:0;background:var(--card);text-align:left;cursor:pointer;font-size:var(--fs-body)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-soft);color:var(--green);font-weight:600}
.opt.wrong{background:var(--red-soft);color:var(--red)}
.opt.dim{opacity:.5}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--card);font-size:15px;line-height:20px;letter-spacing:-.24px}
.fb b{display:block;margin-bottom:4px;font-size:17px}
.fb.ok b{color:var(--green)}.fb.no b{color:var(--red)}
.field{width:100%;min-height:50px;padding:12px var(--card-pad);border-radius:var(--radius-card);border:0;background:var(--card);color:var(--label);font:17px/22px var(--font);letter-spacing:-.41px}
textarea.field{min-height:180px;resize:vertical}
.field::placeholder{color:var(--label3)}
.audio{display:flex;align-items:center;gap:var(--row-gap);background:var(--card);border-radius:var(--radius-card);padding:12px;margin-bottom:var(--card-pad)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px}
.play.small{width:32px;height:32px;background:var(--accent-soft);color:var(--accent)}
.play.small svg{width:14px;height:14px}
.audio-t{flex:1;min-width:0}
.audio-t b{display:block;font-size:15px;font-weight:600}
.audio-t span{font-size:13px;color:var(--label2)}
.chip{border:0;background:var(--fill);color:var(--label);height:32px;padding:0 12px;border-radius:16px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.transcript{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;font-size:15px;line-height:20px;letter-spacing:-.24px}
.line b{flex:none;width:86px;color:var(--label2);font-weight:500;font-size:13px;padding-top:1px}
.lesson p{margin:0 0 12px;font-size:17px;line-height:24px}
.ex{display:flex;align-items:center;gap:12px}
.ex .row-title{font-size:16px}
.flash{background:var(--card);border-radius:16px;min-height:260px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border:0;width:100%;cursor:pointer}
.flash .en{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;text-wrap:balance}
.flash .ru{font-size:19px;line-height:24px;color:var(--label)}
.flash .exs{font-size:15px;line-height:20px;color:var(--label2);font-style:italic;max-width:34ch}
.flash .tap{font-size:13px;color:var(--label3)}
.wc{font-size:13px;color:var(--label2);margin-top:6px;font-variant-numeric:tabular-nums}
.hint{font-size:15px;color:var(--label2);line-height:20px;margin:0 0 12px}
.prompt{font-size:17px;line-height:24px;margin:0 0 10px}
.summary{text-align:center;padding:28px 16px}
.summary .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.summary p{color:var(--label2);margin:6px 0 0}

/* Progress screen */
.cefr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.cefr div{height:30px;border-radius:6px;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2)}
.cefr div.cur{background:var(--accent);color:#fff}
.cefr div.goal{background:var(--accent-soft);color:var(--accent);outline:1.5px dashed var(--accent);outline-offset:-1.5px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--label2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.days14{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:12px}
.days14 i{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--fill)}
.days14 i.on{background:var(--accent)}

/* Media */
.poster{width:56px;height:76px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.3px;line-height:16px;text-align:center;
  background:linear-gradient(160deg,#1E9E5A,#0B5B34)}
.epi{font-family:var(--mono);font-size:13px;color:var(--label2)}
.empty{text-align:center;padding:36px 20px;color:var(--label2);font-size:15px;line-height:20px}
.empty b{display:block;color:var(--label);font-size:17px;margin-bottom:6px}
.empty svg{width:44px;height:44px;color:var(--label3);margin-bottom:10px}
.del{border:0;background:none;color:var(--red);font-size:15px;padding:6px;cursor:pointer;min-width:44px;min-height:44px}

/* Settings controls */
.row select,.row input[type=time]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;color:var(--label);font:15px var(--font);max-width:52vw}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row input.inline{flex:1;min-width:0;border:0;background:none;color:var(--label);font:17px var(--font);text-align:right;padding:0}
.row input.inline::placeholder{color:var(--label3)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0;height:var(--tabbar-h);padding:var(--tab-pad-top) 0 0;border:0;background:none;color:var(--tab-inactive);font-size:10px;font-weight:500;letter-spacing:.1px;cursor:pointer}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:86vh}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.sheet-h b{font-size:17px;font-weight:600}
.sheet-h .nav-btn:last-child{justify-self:end;font-weight:600}
.sheet-h .nav-btn:disabled{color:var(--label3)}
.trbox{background:var(--card);border-radius:12px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:20px}
.trbox .ru{font-size:17px;font-weight:600;margin-bottom:4px}
.trbox a{color:var(--accent);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:13px;color:var(--label2);margin:4px 16px -4px}
.code{width:100%;min-height:200px;font:12px/16px var(--mono);border:0;border-radius:12px;background:var(--card);color:var(--label);padding:12px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--label);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:calc(100% - 32px);animation:fade .2s}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tiles.answer{min-height:56px;padding:10px;border-radius:var(--radius-card);background:var(--card);align-items:center}
.tile-w{border:0;border-radius:10px;background:var(--fill);color:var(--label);font-size:var(--fs-body);padding:9px 12px;cursor:pointer;min-height:40px}
.tile-w.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tile-w:disabled{opacity:.3;cursor:default}

.mic-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

.fb.almost b:first-child{color:var(--orange)}
.opt.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.passage{white-space:pre-line;font-size:var(--fs-sub);line-height:21px;margin-bottom:16px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--label);border-radius:var(--radius-card);padding:12px var(--card-pad);margin-bottom:var(--block-gap);font-size:var(--fs-sub);line-height:20px}

hoice", "q": "I'm used to ___ from home.", "options": ["worked", "working", "work"], "a": 1, "explain": "Я привыкла работать из дома."}, {"kind": "choice", "q": "She is ___ the new software.", "options": ["getting use to", "getting used to", "used to"], "a": 1, "explain": "Она привыкает к новой программе."}, {"kind": "choice", "q": "We ___ design reviews.", "options": ["didn't use to have", "didn't used to have", "weren't used to have"], "a": 0, "explain": "Раньше у нас не было дизайн-ревью."}, {"kind": "choice", "q": "Did you ___ in London?", "options": ["use to living", "use to live", "used to live"], "a": 1, "explain": "Ты раньше жила в Лондоне?"}, {"kind": "choice", "q": "I'm not used to ___ English at work.", "options": ["speaking", "spoke", "speak"], "a": 0, "explain": "Я не привыкла говорить по-английски на работе."}, {"kind": "choice", "q": "You'll soon ___ the noise.", "options": ["get used to", "be use to", "use to"], "a": 0, "explain": "Ты скоро привыкнешь к шуму."}, {"kind": "choice", "q": "He ___ a lot of coffee.", "options": ["used to drinking", "used to drink", "is used to drink"], "a": 1, "explain": "Раньше он пил много кофе."}, {"kind": "choice", "q": "It took me a month to get used to ___ up early.", "options": ["woke", "wake", "waking"], "a": 2, "explain": "Мне понадобился месяц, чтобы привыкнуть рано вставать."}, {"kind": "choice", "q": "Are you used to ___ with developers?", "options": ["working", "work", "worked"], "a": 0, "explain": "Ты привыкла работать с разработчиками?"}]}, {"id": "p2-d2-g3", "type": "mix", "title": "Понимание на слух", "minutes": 2, "items": [{"kind": "choice", "say": "We used to meet every Monday.", "q": "Что означает эта фраза?", "options": ["Она привыкает к новой программе.", "Раньше я работала в офисе.", "Раньше мы встречались каждый понедельник."], "a": 2, "explain": "We used to meet every Monday."}, {"kind": "choice", "say": "I can't get used to this keyboard.", "q": "Что означает эта фраза?", "options": ["Я не могу onomic** — экономический · **economical** — экономичный. **fun** — весёлый, интересный · **funny** — смешной."], "examples": [{"en": "This topic is still relevant.", "ru": "Эта тема всё ещё актуальна."}, {"en": "Can I borrow your charger?", "ru": "Можно взять твою зарядку?"}, {"en": "Could you lend me your pen?", "ru": "Одолжишь мне ручку?"}, {"en": "The weather can affect your mood.", "ru": "Погода влияет на настроение."}], "id": "p2-d5-g1"}, {"id": "p2-d5-g2", "type": "mix", "title": "Узнавание: выберите вариант", "minutes": 2, "items": [{"kind": "choice", "q": "Her argument was very ___.", "options": ["compulsory", "compelling", "complimentary"], "a": 1, "explain": "Её аргумент был очень убедительным."}, {"kind": "choice", "q": "The video tells a ___ story.", "options": ["compulsory", "compelling", "complete"], "a": 1, "explain": "Видео рассказывает захватывающую историю."}, {"kind": "choice", "q": "Wearing a helmet is ___ here.", "options": ["compelling", "compulsory", "comfortable"], "a": 1, "explain": "Здесь обязательно носить шлем."}, {"kind": "choice", "q": "English is a ___ subject at school.", "options": ["compelling", "compulsory", "complicated"], "a": 1, "explain": "Английский — обязательный предмет в школе."}, {"kind": "choice", "q": "That's a ___ idea.", "options": ["sensitive", "sensational", "sensible"], "a": 2, "explain": "Это разумная идея."}, {"kind": "choice", "q": "Wear ___ shoes for the hike.", "options": ["sensible", "sensual", "sensitive"], "a": 0, "explain": "Надень удобную практичную обувь для похода."}, {"kind": "choice", "q": "She's very ___ to criticism.", "options": ["senseless", "sensitive", "sensible"], "a": 1, "explain": "Она очень чувствительна к критике."}, {"kind": "choice", "q": "This is ___ information, don't share it.", "options": ["sensitive", "sensible", "sensory"], "a": 0, "explain": "Это конфиденциальная информация, не распространяй её."}, {"kind": "choice", "q": "We ___ found the bug.", "options": ["actually", "possibly", d7-u1", "type": "translate", "title": "Итог: рабочие фразы", "minutes": 9, "items": [{"kind": "translate", "ru": "Спасибо, это очень полезно.", "a": ["Thanks, that's really helpful."]}, {"kind": "translate", "ru": "Это заняло бы слишком много времени на разработку.", "a": ["That would take too long to build."]}, {"kind": "translate", "ru": "Здесь вы видите главный экран.", "a": ["Here you can see the main screen."]}, {"kind": "translate", "ru": "Один проект, которым я горжусь, — редизайн интернет-магазина.", "a": ["One project I'm proud of is a redesign of an online store."]}, {"kind": "translate", "ru": "Вы свободны для короткого созвона завтра?", "a": ["Are you free for a quick call tomorrow?"]}, {"kind": "translate", "ru": "Можете остановить меня в любой момент.", "a": ["Feel free to stop me at any point."]}, {"kind": "translate", "ru": "Эта часть кажется немного перегруженной.", "a": ["This part feels a bit crowded."]}, {"kind": "translate", "ru": "У меня есть несколько открытых вопросов.", "a": ["I have a few open questions."]}, {"kind": "translate", "ru": "Как выглядит обычный день?", "a": ["What does a typical day look like?"]}, {"kind": "translate", "ru": "Быстрый вопрос по логотипу.", "a": ["Quick question about the logo."]}, {"kind": "translate", "ru": "Мне нравится, насколько понятная навигация.", "a": ["I like how clear the navigation is."]}, {"kind": "translate", "ru": "Может быть, можно упростить этот шаг.", "a": ["Maybe we could simplify this step."]}, {"kind": "translate", "ru": "Если нажать сюда, откроется нижняя шторка.", "a": ["If you tap here, a bottom sheet opens."]}, {"kind": "translate", "ru": "Главная цель здесь — сократить отток.", "a": ["The main goal here is to reduce drop-offs."]}]}, {"id": "p2-d7-u2", "type": "order", "title": "Итог: соберите фразы", "minutes": 4, "items": [{"kind": "order", "en": "Could we align on the scope this week?", "ru": "Можем согласовать объём работ на этой неделе?"}, {"kind": "order", "en": "Good catch, I'll fix it.", "ru": "Хорошо подмечено, я исправлю."}, {"kind": "order", "en": "Let me know if you have any questions.", "ru": "Дайте знать, если будут вопросы."}, {"kind": "order", "en": "This icon is a bit confusing.", "ru": "Эта иконка немного сбивает с толку."}, {"kind": "order", "en": "Without the content, I can't finish the layouts.", "ru": "Без контента я не могу закончить макеты."}, {"kind": "order", "en": "I'm still waiting for the texts for the website.", "ru": "Я всё ещё жду тексты для сайта."}, {"kind": "order", "en": "I'll keep you posted.", "ru": "Буду держать вас в курсе."}, {"kind": "order", "en": "Does this make sense so far?", "ru": "Пока всё понятно?"}]}, {"id": "p2-d7-u3", "type": "shadow", "title": "Итог: повторите вслух", "minutes": 3, "items": [{"kind": "shadow", "en": "Let's test both options and decide.", "ru": "Давайте протестируем оба варианта и решим."}, {"kind": "shadow", "en": "Overall, it looks great.", "ru": "В целом выглядит отлично."}, {"kind": "shadow", "en": "One small thing: the spacing is inconsistent.", "ru": "Одна мелочь: отступы непоследовательные."}, {"kind": "shadow", "en": "Great job on the onboarding!", "ru": "Отличная работа с онбордингом!"}, {"kind": "shadow", "en": "I think we lost you for a second.", "ru": "Кажется, мы вас на секунду потеряли."}, {"kind": "shadow", "en": "Can you hear me okay?", "ru": "Вы меня хорошо слышите?"}, {"kind": "shadow", "en": "It might be worth testing this with users.", "ru": "Возможно, стоит протестировать это на пользователях."}, {"kind": "shadow", "en": "Here is the link to the Figma file.", "ru": "Вот ссылка на файл в Figma."}, {"kind": "shadow", "en": "That's a fair point.", "ru": "Справедливое замечание."}, {"kind": "shadow", "en": "Sorry for the late reply.", "ru": "Извините за поздний ответ."}]}], "title": "Итог недели"}], "media": [{"id": "art-design-crits", "kind": "article", "topic": "ux", "title": "How a team built a culture of design crits", "source": "ESFA Digital blog (GOV.UK)", "author": "Jaskiran Kang", "published": "15.01.2020", "level": "B2", "minutes": 25, "url": "https://sfadigital.blog.gov.uk/2020/01/15/how-the-apprenticeship-service-has-been-creating-a-culture-of-design-crits", "about": "Ведущий дизайнер государственного сервиса рассказывает, как команда перешла от случайного фидбэка к регулярным дизайн-критикам: какой формат придумали, что пошло не так и что получилось. Много живой лексики для ревью.", "note": "Вопросы составлены по статье своими словами, текст статьи здесь не копируется.", "tasks": [{"id": "m1-1", "type": "cards", "title": "Слова до чтения", "minutes": 4, "cards": ["a1", "a2", "a3", "a4", "a5", "a6", "a7", "a8"]}, {"id": "m1-2", "type": "quiz", "title": "Понимание статьи", "minutes": 8, "items": [{"q": "Before the change, how did designers usually get feedback?", "options": ["In weekly formal reviews", "Ad hoc, from friendly colleagues or on Slack", "Only from users"], "a": 1, "explain": "Фидбэк был случайным: от знакомых коллег лично или в Slack."}, {"q": "What was a problem with that feedback?", "options": ["It came too late and reached only a few people", "It was too formal", "It was always negative"], "a": 0, "explain": "Он доходил до немногих и редко приходил на раннем этапе."}, {"q": "Which goal did the team set?", "options": ["To hire more designers", "To get designers to share work early", "To stop using sticky notes"], "a": 1, "explain": "Одна из трёх целей — делиться работой рано."}, {"q": "How long was the crit session they adapted?", "options": ["15 minutes", "45 minutes", "Two hours"], "a": 1, "explain": "Формат на 45 минут: показ, разбор фидбэка, темы и действия."}, {"q": "What is the \"golden rule\" of their crits?", "options": ["Always agree with the lead", "You are not your design", "Never show unfinished work"], "a": 1, "explain": "Критикуют работу, а не человека."}, {"q": "What went wrong at the start?", "options": ["Sessions were cancelled because few people came", "Managers banned the sessions", "The room was too small"], "a": 0, "explain": "Несколько сессий отменили из-за низкой явки."}, {"q": "How did the author fix that problem?", "options": ["By making crits compulsory", "Through one-to-one conversations about a safe, supportive space", "By offering free lunch"], "a": 1, "explain": "Личные разговоры с дизайнерами о том, что это безопасное пространство."}, {"q": "What happens with the actions after a crit?", "options": ["They are forgotten", "They go into the delivery backlog and are prioritised with the team", "Only the presenter sees them"], "a": 1, "explain": "Действия попадают в бэклог и приоритизируются."}]}, {"id": "m1-3", "type": "translate", "title": "Перевод с новыми словами", "minutes": 4, "items": [{"kind": "translate", "ru": "Наши дизайнеры работали изолированно.", "a": ["Our designers worked in silos.", "Our designers were working in silos."]}, {"kind": "translate", "ru": "Мне нужен конструктивный фидбэк.", "a": ["I need constructive feedback."]}, {"kind": "translate", "ru": "Встречу отменили из-за низкой явки.", "a": ["The meeting was cancelled because of low turnout.", "The meeting was called off because of low turnout.", "The meeting was cancelled due to low turnout."]}, {"kind": "translate", "ru": "Это помогло мне точно понять, где мне нужна помощь.", "a": ["It helped me pinpoint where I needed help.", "This helped me pinpoint where I needed help."]}, {"kind": "translate", "ru": "Давайте расставим приоритеты вместе с командой.", "a": ["Let's prioritise with the team.", "Let's prioritise together with the team."]}, {"kind": "translate", "ru": "Фидбэк должен быть диалогом.", "a": ["Feedback should be a two-way conversation."]}]}, {"id": "m1-4", "type": "write", "title": "Пересказ и мнение", "minutes": 8, "prompt": "Перескажите статью своими словами (3–4 предложения) — можно вслух через «Надиктовать» и ответьте: сработал бы такой формат в вашей команде? Почему?", "hint": "The article is about… / The team… / In my team, this would…", "minWords": 70}]}, {"id": "art-habits", "kind": "article", "topic": "general", "title": "Forming useful habits is harder than we think", "source": "The Irish Times", "author": "William Reville", "published": "01.05.2025", "level": "B2–C1", "minutes": 25, "url": "https://www.irishtimes.com/science/2025/05/01/forming-useful-habits-not-as-easy-as-widely-believed", "about": "Почему правило «21 дня» — миф и сколько на самом деле занимает формирование привычки по данным исследований. Тема прямо про вас: автоматизм в английском строится так же.", "note": "Вопросы составлены по статье своими словами, текст статьи здесь не копируется.", "tasks": [{"id": "m2-1", "type": "cards", "title": "Слова до чтения", "minutes": 4, "cards": ["a9", "a10", "a11", "a12", "a13", "a14", "a15", "a16"]}, {"id": "m2-2", "type": "quiz", "title": "Понимание статьи", "minutes": 8, "items": [{"q": "According to the article, what makes a habit form?", "options": ["Strong willpower alone", "Repeating a behaviour in a stable context", "Doing something once, very intensely"], "a": 1, "explain": "Повторение в одном и том же контексте связывает сигнал и действие."}, {"q": "Where does the \"21 days\" idea come from?", "options": ["A large controlled trial", "A surgeon's observations of his patients in 1960", "A university survey"], "a": 1, "explain": "Из наблюдений хирурга Максвелла Мольца, а не из строгих исследований."}, {"q": "How many students took part in the main study?", "options": ["About 20", "About 100", "About 1,000"], "a": 1, "explain": "96 студентов."}, {"q": "On average, when did automaticity stop growing?", "options": ["After about 21 days", "After about 66 days", "After about a year"], "a": 1, "explain": "В среднем около 66 дней."}, {"q": "Which habits took longer to form?", "options": ["Drinking habits", "Eating habits", "Exercise habits"], "a": 2, "explain": "Привычки, связанные со спортом, формировались дольше."}, {"q": "What happened to almost half of the participants?", "options": ["They formed a habit in a week", "They were not consistent enough to form a habit", "They left the study on day one"], "a": 1, "explain": "Почти половина действовала недостаточно последовательно."}, {"q": "What did a later review of studies find?", "options": ["Habits take about two to five months", "Habits always take exactly 66 days", "Habits cannot be changed"], "a": 0, "explain": "От двух до пяти месяцев, и у всех по-разному."}, {"q": "Which practical tip is in the article?", "options": ["Link the new behaviour to a daily cue", "Change your routine every day", "Rely only on motivation"], "a": 0, "explain": "Привязать новое действие к ежедневному сигналу."}]}, {"id": "m2-3", "type": "translate", "title": "Перевод с новыми словами", "minutes": 4, "items": [{"kind": "translate", "ru": "Эта привычка глубоко укоренилась.", "a": ["This habit is deeply ingrained.", "The habit is deeply ingrained."]}, {"kind": "translate", "ru": "Через некоторое время это происходит без усилий.", "a": ["After a while, it happens effortlessly.", "After some time, it happens effortlessly."]}, {"kind": "translate", "ru": "Нужно заниматься последовательно.", "a": ["You need to practise consistently.", "You need to practice consistently.", "You have to practise consistently."]}, {"kind": "translate", "ru": "Привяжи новую привычку к ежедневному сигналу.", "a": ["Link the new habit to a daily cue.", "Tie the new habit to a daily cue."]}, {"kind": "translate", "ru": "Универсального подхода не существует.", "a": ["There is no one-size-fits-all approach.", "There's no one-size-fits-all approach."]}, {"kind": "translate", "ru": "Мой прогресс вышел на плато.", "a": ["My progress has plateaued.", "My progress plateaued."]}]}, {"id": "m2-4", "type": "write", "title": "Моя привычка", "minutes": 8, "prompt": "Какую привычку вы сейчас формируете (например, английский каждый день)? Опишите сигнал, действие и что мешает. Используйте минимум 4 слова из статьи.", "hint": "My cue is… / I try to practise consistently… / There is no one-size-fits-all…", "minWords": 60}]}, {"id": "pod-6min", "kind": "podcast", "topic": "general", "title": "6 Minute English", "source": "BBC Learning English", "level": "B1–B2", "minutes": 20, "url": "https://podcasts.apple.com/podcast/262026947?l=en", "about": "Короткие выпуски: два ведущих 6 минут обсуждают одну тему и разбирают несколько полезных слов. Удобно слушать в дороге. Выбирайте любой свежий выпуск.", "note": "Расшифровки выпусков мне отсюда недоступны, поэтому задания общие. Запишите слова из выпуска в задании 2 и пришлите экспорт — по ним я соберу упражнения.", "tasks": [{"id": "m3-1", "type": "lesson", "title": "Как слушать подкаст", "minutes": 2, "body": ["**1-й раз** — просто слушайте, не останавливаясь. Цель — понять тему и общий смысл.", "**2-й раз** — останавливайте и записывайте слова, которые разбирают ведущие, и фразы, которые не поняли.", "**3-й раз** — включите 30 секунд любимого куска и повторяйте за ведущими вслух (shadowing)."], "examples": []}, {"id": "m3-2", "type": "write", "title": "Слова выпуска", "minutes": 8, "prompt": "Напишите название выпуска и слова, которые разбирали ведущие (обычно их около шести), — к каждому слову пример из выпуска или свой.", "hint": "Episode: … / 1. … — …", "minWords": 25}, {"id": "m3-3", "type": "write", "title": "Пересказ выпуска вслух", "minutes": 6, "prompt": "Перескажите вслух, о чём был выпуск, в 3–5 предложениях — нажмите «Надиктовать» и говорите по-английски. Используйте минимум 2 слова из выпуска. Потом поправьте текст, если распознавание ошиблось.", "hint": "The episode is about… / They discuss… / I learned that…", "minWords": 40}]}]}</script>
<script type="application/json" id="seed-test">{"type": "level-test", "id": "level-v1", "version": 1, "title": "Проверка уровня · версия 1", "created": "2026-10-30", "skills": {"grammar": {"title": "Грамматика и лексика", "minutes": 12, "about": "20 вопросов от A2 до C1, сложность растёт. Если не знаете ответа, не угадывайте — выберите наугад только если есть мысль.", "parts": [{"title": "Выберите правильный вариант", "items": [{"q": "We ___ to the cinema last weekend.", "options": ["go", "went", "have gone"], "a": 1, "band": "A2"}, {"q": "There isn't ___ milk in the fridge.", "options": ["many", "some", "much"], "a": 2, "band": "A2"}, {"q": "Anna is ___ than her sister.", "options": ["taller", "more tall", "tallest"], "a": 0, "band": "A2"}, {"q": "It's dark in here. Can you turn ___ the light?", "options": ["on", "in", "up"], "a": 0, "band": "A2"}, {"q": "My train ___ at 7 a.m. tomorrow.", "options": ["leave", "leaves", "leaving"], "a": 1, "band": "A2"}, {"q": "I've worked at this company ___ three years.", "options": ["since", "for", "during"], "a": 1, "band": "B1"}, {"q": "If it rains tomorrow, we ___ at home.", "options": ["stay", "will stay", "would stay"], "a": 1, "band": "B1"}, {"q": "The report ___ by the manager yesterday.", "options": ["was written", "wrote", "has written"], "a": 0, "band": "B1"}, {"q": "I'm looking forward to ___ from you.", "options": ["hear", "hearing", "heard"], "a": 1, "band": "B1"}, {"q": "She asked me where ___.", "options": ["I lived", "did I live", "do I live"], "a": 0, "band": "B1"}, {"q": "I'd rather you ___ this to anyone yet.", "options": ["don't mention", "didn't mention", "not mention"], "a": 1, "band": "B2"}, {"q": "By next June, I ___ here for ten years.", "options": ["will work", "will have worked", "am working"], "a": 1, "band": "B2"}, {"q": "The new rules will ___ effect from Monday.", "options": ["take", "make", "have"], "a": 0, "band": "B2"}, {"q": "She ___ the job offer because the salary was too low.", "options": ["turned down", "turned up", "turned over"], "a": 0, "band": "B2"}, {"q": "It's high time we ___ the project.", "options": ["start", "started", "will start"], "a": 1, "band": "B2"}, {"q": "Not only ___ late, but he also forgot the slides.", "options": ["he was", "was he", "he has been"], "a": 1, "band": "C1"}, {"q": "Had I known about the delay, I ___ a later train.", "options": ["would take", "would have taken", "took"], "a": 1, "band": "C1"}, {"q": "The proposal was rejected, ___ was hardly surprising.", "options": ["that", "which", "what"], "a": 1, "band": "C1"}, {"q": "The results were ___: they could be read in two different ways.", "options": ["ambiguous", "ambitious", "ambient"], "a": 0, "band": "C1"}, {"q": "The company ___ its losses on the weak market.", "options": ["blamed", "accused", "charged"], "a": 0, "band": "C1"}]}]}, "reading": {"title": "Чтение", "minutes": 15, "about": "3 текста разной сложности, по 4 вопроса к каждому. Можно перечитывать текст сколько угодно.", "parts": [{"title": "Текст 1 · Сообщение в рабочем чате", "passage": "Hi everyone,\n\nFrom Monday 9 November the office on the third floor will be closed for repairs for two weeks. During this time, the design team will work on the fifth floor, in the meeting room next to the kitchen.\n\nPlease take your laptops home on Friday evening — there will be no space to leave them. The coffee machine on the fifth floor is broken, but a new one will arrive on Tuesday.\n\nIf you would rather work from home during the repairs, tell your manager by Thursday.\n\nThanks,\nMarta", "items": [{"q": "How long will the repairs take?", "options": ["One week", "Two weeks", "Until Tuesday"], "a": 1, "band": "A2"}, {"q": "Where will the design team work?", "options": ["On the third floor", "In a meeting room on the fifth floor", "Only from home"], "a": 1, "band": "A2"}, {"q": "What should people do on Friday evening?", "options": ["Take their laptops home", "Tell their manager", "Buy a new coffee machine"], "a": 0, "band": "B1"}, {"q": "Working from home during the repairs is…", "options": ["required for everyone", "not allowed", "possible if you tell your manager by Thursday"], "a": 2, "band": "B1"}]}, {"title": "Текст 2 · Статья о дизайнере", "passage": "When Lena started her first job as a product designer, she avoided talking to developers. She was worried they would ask technical questions she couldn't answer.\n\nAfter a difficult project in which several of her screens had to be redesigned at the last minute, she decided to change her approach. She didn't try to become a programmer; instead, she spent an hour a week learning the basics of how web pages are built.\n\nWithin a few months, she noticed that her conversations with developers had become shorter and more productive. She could predict which ideas would be expensive to build and suggest simpler alternatives early.\n\n\"The biggest change wasn't technical,\" she says. \"It was that developers started inviting me to their planning meetings.\" Today Lena recommends that every junior designer spend a little time on the basics — not to write code, but to understand the people who do.", "items": [{"q": "Why did Lena avoid developers at first?", "options": ["She didn't like them", "She was afraid of technical questions", "She was too busy"], "a": 1, "band": "B1"}, {"q": "What made her change her approach?", "options": ["A project where screens had to be redone late", "Advice from her manager", "A course she took"], "a": 0, "band": "B1"}, {"q": "What was her main aim in learning the basics?", "options": ["To become a developer", "To understand how web pages are built", "To find a better job"], "a": 1, "band": "B2"}, {"q": "According to Lena, the most important result was that…", "options": ["she started writing code", "developers began to include her in planning", "she had fewer meetings"], "a": 1, "band": "B2"}]}, {"title": "Текст 3 · Статья о концентрации", "passage": "Most people believe that they are good at multitasking, but research suggests otherwise. What we call multitasking is usually rapid switching between tasks, and every switch carries a cost: it takes time for the brain to fully re-engage with the previous task.\n\nFor short, routine activities this cost is barely noticeable. For complex work, such as writing or designing, it can add up to a significant loss of time and quality.\n\nInterestingly, the problem is not only the interruptions themselves but the expectation of them. Some studies suggest that people perform worse when they merely know a message might arrive, even if it never does.\n\nThis has led some companies to experiment with \"quiet hours\" — fixed periods when no meetings are scheduled and chat notifications are paused. Early results are encouraging, although critics point out that such policies only work if managers follow them too; otherwise, employees feel they must stay available anyway.", "items": [{"q": "What does the writer say about multitasking?", "options": ["It is mostly switching quickly between tasks", "It improves the quality of work", "Most people are good at it"], "a": 0, "band": "B2"}, {"q": "The cost of switching is most serious for…", "options": ["routine tasks", "complex tasks such as writing", "short meetings"], "a": 1, "band": "B2"}, {"q": "According to the text, performance can drop when people…", "options": ["receive too many messages", "only expect that a message may arrive", "switch off notifications"], "a": 1, "band": "C1"}, {"q": "What is the critics' point about quiet hours?", "options": ["They are too expensive", "They only work if managers respect them as well", "They reduce communication in teams"], "a": 1, "band": "C1"}]}]}, "listening": {"title": "Аудирование", "minutes": 12, "about": "3 части: короткие фразы, диалог, выступление. Слушайте сколько угодно раз, но не открывайте текст — его нет.", "parts": [{"title": "Часть 1 · Короткие фразы", "items": [{"say": "The meeting has been moved from Tuesday to Thursday aft     prefs: ['ava (premium)', 'zoe (premium)', 'ava (enhanced)', 'zoe (enhanced)', 'allison (enhanced)', 'samantha (enhanced)', 'susan (enhanced)', 'ava', 'samantha', 'zoe', 'allison', 'susan', 'nicky', 'google us english'] },

let VOICES = [];
function loadVoices() { try { VOICES = (speechSynthesis.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang)); } catch (e) { VOICES = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (UI.tab === 'settings' && !UI.stack.length) render(); }; } catch (e) {}
const RU_VOICE = { 'дэниэл': 'daniel', 'дэниел': 'daniel', 'даниэль': 'daniel', 'дэниель': 'daniel', 'кейт': 'kate', 'оливер': 'oliver', 'джейми': 'jamie', 'серена': 'serena', 'сирена': 'serena', 'стефани': 'stephanie', 'марта': 'martha', 'артур': 'arthur', 'саманта': 'samantha', 'ава': 'ava', 'эва': 'ava', 'эйва': 'ava', 'зои': 'zoe', 'зоуи': 'zoe', 'эллисон': 'allison', 'элисон': 'allison', 'сьюзан': 'susan', 'сюзан': 'susan', 'ники': 'nicky', 'никки': 'nicky', 'эван': 'evan', 'нейтан': 'nathan', 'натан': 'nathan', 'том': 'tom', 'алекс': 'alex', 'аарон': 'aaron', 'эрон': 'aaron' };
const vBase = v => {
  const uri = String(v.voiceURI || '');
  if (/^com\.apple\./i.test(uri) && !/eloquence|novelty|ttsbundle/i.test(uri)) { const last = uri.split('.').pop().toLowerCase(); if (/^[a-z]+$/.test(last)) return last; }
  const first = v.name.toLowerCase().replace(/^(microsoft|apple)\s+/, '').split(/[\s(,\-–]/)[0];
  return RU_VOICE[first] || first;
};
const vQuality = v => { const t = v.name + ' ' + (v.voiceURI || ''); return /premium|премиум|высок/i.test(t) ? 2 : /enhanced|улучш|расшир/i.test(t) ? 1 : 0; };
function voiceFor(slotId) {
  const sl = VOICE_SLOTS.find(s => s.id === slotId); if (!sl) return null;
  const vs = VOICES.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(sl.lang));
  // Google voices in Chrome
  const g = sl.prefs.filter(p => p.startsWith('google')).map(p => vs.find(v => v.name.toLowerCase() === p)).find(Boolean);
  const bases = [...new Set(sl.prefs.filter(p => !p.startsWith('google')).map(p => p.split(' (')[0]))];
  const cands = vs.filter(v => bases.includes(vBase(v)));

}

}

    else {

          <button class="play small" data-act="speak" data-text="${esc(w.text)}" aria-label="${L('Произнести', 'Play')}">${IC.play}</button>
          <span class="row-main"><span class="row-title">${esc(w.text)}</span><span class="row-sub">${w.ru ? esc(w.ru) : L('Перевод — в задании от Claude', 'Translation will come in a task from Claude')}${w.ctx ? ' · ' + esc(w.ctx) : ''}</span></span>
          <button class="del" data-act="del-word" data-id="${esc(w.id)}" aria-label="${L('Удалить', 'Delete')}">${IC.trash}</button></div>`).join('') + '</div>';

      const w = sh.watched.includes(e.ep), n = S.myWords.filter(x => x.show === id && x.ep === e.ep).length;
      return `<div class="row static"><span class="check ${w ? 'on' : ''}">${w ? IC.check : ''}</span>
        <span class="row-main"><span class="row-title"><span class="epi">${esc(e.ep)}</span> ${esc(e.title || '')}</span>

        ${w ? '' : `<button class="chip on" data-act="watched" data-ep="${esc(e.ep)}">${L('Посмотрела', 'Watched')}</button>`}</div>`;
    }).join('') + `</div><div class="gfoot">${L('Задания по серии появятся здесь после импорта пакета. Чтобы Claude их собрал, отправьте экспорт: Настройки → Экспорт.', 'Episode tasks appear here after a pack import. To get them, send Claude an export: Settings → Export.')}</div>`;

/* ---------- Level checks ---------- */
const SKILLS = ['grammar', 'reading', 'listening', 'writing', 'speaking'];
const SKILL_UI = {
  grammar: { ru: 'Грамматика и лексика', en: 'Grammar & vocabulary', icon: IC.abc, color: 'var(--blue)' },
  reading: { ru: 'Чтение', en: 'Reading', icon: IC.read, color: 'var(--green)' },
  listening: { ru: 'Аудирование', en: 'Listening', icon: IC.ear, color: 'var(--orange)' },
  writing: { ru: 'Письмо', en: 'Writing', icon: IC.pen, color: 'var(--pink)' },
  speaking: { ru: 'Говорение', en: 'Speaking', icon: IC.mic, color: 'var(--teal)' }
};
const skillName = k => L(SKILL_UI[k].ru, SKILL_UI[k].en);
const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const BANDS = ['A2', 'B1', 'B2', 'C1'];
function currentTest() { return S.tests.slice().sort((a, b) => (b.version || 0) - (a.version || 0))[0]; }
function latestResult(skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const r = S.checks[i].results[skill]; if (r) return Object.assign({ date: S.checks[i].date, test: S.checks[i].test }, r); } return null; }
function latestLevel(skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const r = S.checks[i].results[skill]; if (r && r.level) return r; } return null; }
function doneInTest(testId, skill) { for (let i = S.checks.length - 1; i >= 0; i--) { const c = S.checks[i]; if (c.test === testId && c.results[skill]) return Object.assign({ date: c.date }, c.results[skill]); } return null; }
function overallLevel() {
  const ls = SKILLS.map(k => latestLevel(k)).filter(Boolean).map(r => LEVELS.indexOf(r.level)).filter(i => i >= 0);
  if (!ls.length) return { level: 'B1', n: 0 };
  return { level: LEVELS[Math.floor(ls.reduce((a, b) => a + b, 0) / ls.length)], n: ls.length };
}
function levelFromBands(b) {
  let lvl = 'A1';
  for (const band of BANDS) {
    const x = b[band]; if (!x || !x.t) continue;
    const pass = x.t <= 2 ? x.c >= 1 : x.c / x.t >= 0.6;
    if (pass) lvl = band; else break;
  }
  return lvl;
}
function checkKind(c) {
  return ({ placement: L('Входной тест', 'Placement test'), skill: L('Проверка навыка', 'Skill check'), graded: L('Оценка Claude', 'Graded by Claude') })[c.kind] || esc(c.kind);
}
function skillMinutes(t, k) { return (t.skills[k] && t.skills[k].minutes) || 10; }

function vProgress() {
  const ov = overallLevel(), ci = LEVELS.indexOf(ov.level);
  let h = `<div class="strip"><div class="stat"><b>${IC.flame}${streak()}</b><span>${L('дней подряд', 'days in a row')}</span></div>
     <div class="stat"><b>${doneCount()}</b><span>${L('заданий выполнено', 'tasks done')}</span></div>
     <div class="stat"><b>${Object.keys(S.cards).length}</b><span>${L('слов в повторении', 'words in review')}</span></div></div>`;
  // activity: fills left to right from the first study day
  const t = today(), first = Object.keys(S.activity).filter(k => S.activity[k]).sort()[0];
  let start = first || t; if (addDays(start, 13) < t) start = addDays(t, -13);
  let cells = '', active = 0;

  h += groupHead(L('Активность, 14 дней', 'Activity, 14 days')) + `<div class="panel"><div class="days14">${cells}</div><div class="row-sub" style="margin-top:10px">${L('Дней с занятиями', 'Study days')}: ${active} ${L('из', 'of')} 14</div></div>`;
  h += groupHead(L('Уровень по CEFR', 'CEFR level')) + `<div class="panel"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><b style="font-size:22px">${ov.level}</b><span class="row-sub">${L('цель', 'goal')}: ${LEVELS[ci + 1] || ov.level}</span></div>
     <div class="cefr" style="margin-bottom:0">${LEVELS.map((l, i) => `<div class="${i === ci ? 'cur' : ''}">${l}</div>`).join('')}</div>
     <div class="actions" style="margin-top:16px"><button class="btn" data-act="open-checks">${L('Пройти проверку уровня', 'Take a level check')}</button></div></div>`;

    else { sub = L('не проверено · ', 'not checked · ') + mins(skillMinutes(currentTest(), k)); pill = '<span class="pill big">—</span>'; }
    return `<button class="row" data-act="open-check" data-skill="${k}"><span class="row-main"><span class="row-title">${skillName(k)}</span><span class="row-sub">${sub}</span></span>${pill}${IC.chevR}</button>`;
  }).join('') + '</div>';
  h += `<div class="gfoot">${L('Шкала CEFR (A1–C2) — общая для Cambridge, IELTS и TOEFL. Каждый навык можно проверить отдельно в любой момент. Письмо оценивает Claude, говорение — самооценка.', 'The CEFR scale (A1–C2) is shared by Cambridge, IELTS and TOEFL. Check any skill separately at any time. Writing is graded by Claude, speaking is a self-assessment.')}</div>`;
  const last = S.checks[S.checks.length - 1];

  h += groupHead(L('Проверки', 'Checks')) + `<div class="group icons"><div class="row static"><span class="tile" style="background:var(--accent)">${IC.target}</span>
      <span class="row-main"><span class="row-title">${L('Следующая контрольная', 'Next full check')}</span><span class="row-sub">${fmtShort(from)} – ${fmtShort(to)}</span></span><span class="pill">${L('5 навыков', '5 skills')}</span></div>` +
    S.checks.slice().reverse().map(c => {
      const ks = Object.keys(c.results), r0 = c.results[ks[0]];

  return { title: L('Прогресс', 'Progress'), body: h };
}

function vChecks() {
  const t = currentTest();
  const total = SKILLS.reduce((a, k) => a + skillMinutes(t, k), 0);
  const doneAll = SKILLS.every(k => doneInTest(t.id, k));
  let h = '';
  if (doneAll) h += `<div class="notice">${IC.check}<span>${L('Все навыки в этой версии пройдены. Новую версию теста Claude выложит к следующей контрольной — она загрузится сама.', 'All skills in this version are done. Claude will publish a new version for the next full check — it will load automatically.')}</span></div>`;
  h += groupHead(L('Навыки', 'Skills')) + '<div class="group icons">' + SKILLS.map(k => {

    return `<button class="row" data-act="open-check" data-skill="${k}"><span class="tile" style="background:${u.color}">${u.icon}</span>
      <span class="row-main"><span class="row-title">${skillName(k)}</span><span class="row-sub">${sub}</span></span>${d ? `<span class="check on">${IC.check}</span>` : ''}${IC.chevR}</button>`;
  }).join('') + '</div>';
  h += `<div class="gfoot">${L('Навыки можно проходить по одному, в разные дни. Задания составлены по формату Cambridge и IELTS, но свои. Когда пройдены все пять — это полная контрольная.', 'You can take the skills one by one, on different days. The tasks follow the Cambridge and IELTS formats but are original. All five together make a full check.')}</div>`;

}

function checkSteps(sk) { const out = []; (sk.parts || []).forEach((p, pi) => (p.items || []).forEach((it, ii) => out.push({ p, it, pi, ii }))); return out; }
function startCheck(skill) { const t = currentTest(); CS = { skill, test: t.id, started: false, i: 0, answers: [], drafts: [], ticks: {}, phase: 0, result: null }; }
function vCheck(skill) {
  const t = currentTest(), sk = t.skills[skill];
  if (!CS || CS.skill !== skill || CS.test !== t.id) startCheck(skill);
  const title = skillName(skill);
  if (!CS.started) return { title, back: true, body: checkIntro(t, skill, sk) };
  if (CS.result) return { title, back: true, body: checkResult(skill, sk) };
  if (skill === 'writing') return { title, back: true, body: checkWriting(sk) };
  if (skill === 'speaking') return { title, back: true, body: checkSpeaking(sk) };
  return { title, back: true, body: checkChoice(skill, sk) };
}
function checkIntro(t, skill, sk) {
  const d = doneInTest(t.id, skill);
  const n = skill === 'writing' ? sk.parts.length : skill === 'speaking' ? sk.prompts.length : checkSteps(sk).length;
  const unit = skill === 'writing' ? P(n, 'задание', 'задания', 'заданий', 'task', 'tasks') : skill === 'speaking' ? P(n, 'вопрос', 'вопроса', 'вопросов', 'prompt', 'prompts') : P(n, 'вопрос', 'вопроса', 'вопросов', 'question', 'questions');
  let h = `<div class="tmeta"><span class="pill" style="background:${SKILL_UI[skill].color};color:#fff">${L('CEFR A2–C1', 'CEFR A2–C1')}</span><span class="pill">${mins(sk.minutes)}</span><span class="pill">${n} ${unit}</span><span class="pill">${L('версия', 'version')} ${t.version}</span></div>`;
  if (d) h += `<div class="notice">${IC.check}<span><b>${L('Вы уже проходили эту версию', 'You have taken this version')} ${fmtShort(d.date)}${d.level ? ' · ' + d.level : d.pending ? L(' · на проверке', ' · pending') : ''}.</b> ${L('Новую версию теста Claude выложит к следующей контрольной, она загрузится сама. Повторное прохождение этой версии даст завышенный результат: вопросы уже знакомы.', 'Claude will publish a new version for the next full check, and it will load automatically. Retaking this version gives an inflated result: you have seen the questions.')}</span></div>`;
  h += `<div class="panel"><p class="prompt" style="margin:0">${md(sk.about)}</p></div>`;
  h += `<div class="actions"><button class="btn" data-act="check-start">${d ? L('Пройти ещё раз', 'Take again') : L('Начать', 'Start')}</button></div>`;
  return h;
}
function checkChoice(skill, sk) {
  const steps = checkSteps(sk), st = steps[CS.i], it = st.it, p = st.p, sel = CS.answers[CS.i];
  let h = `<div class="progress"><i style="width:${(CS.i / steps.length) * 100}%"></i></div>`;
  h += `<div class="lbl" style="margin:0 0 10px">${esc(p.title)}</div>`;
  if (p.passage) h += `<div class="panel passage">${esc(p.passage)}</div>`;
  if (p.lines) h += `<div class="audio"><button class="play" data-act="check-dialog" aria-label="${L('Прослушать', 'Listen')}">${IC.play}</button>
      <div class="audio-t"><b>${L('Прослушайте запись', 'Listen to the recording')}</b><span>${L('Можно слушать сколько угодно раз', 'Listen as many times as you need')}</span></div>
      <button class="chip" data-act="check-dialog" data-slow="1">${L('Медленно', 'Slow')}</button></div>`;
  if (it.say) h += `<div class="audio"><button class="play" data-act="speak" data-text="${esc(it.say)}" aria-label="${L('Прослушать', 'Listen')}">${IC.play}</button>
      <div class="audio-t"><b>${L('Прослушайте', 'Listen')}</b><span>${L('и ответьте на вопрос', 'and answer the question')}</span></div>
      <button class="chip" data-act="speak" data-text="${esc(it.say)}" data-slow="1">${L('Медленно', 'Slow')}</button></div>`;
  h += `<p class="q">${md(it.q)}</p><div class="opts">` + it.options.map((o, k) => `<button class="opt ${sel === k ? 'sel' : ''}" data-act="check-pick" data-i="${k}"><span>${md(o)}</span>${sel === k ? IC.check : ''}</button>`).join('') + '</div>';
  h += `<div class="btns">${CS.i > 0 ? `<button class="btn sec" data-act="check-prev">${L('Назад', 'Back')}</button>` : ''}<button class="btn" data-act="check-next" ${sel == null ? 'disabled' : ''}>${CS.i === steps.length - 1 ? L('Завершить', 'Finish') : L('Дальше', 'Next')}</button></div>`;
  h += `<div class="qcount">${L('Вопрос', 'Question')} ${CS.i + 1} ${L('из', 'of')} ${steps.length}</div>`;
  return h;
}
function finishChoice(skill, sk) {
  const steps = checkSteps(sk), bands = {};
  let c = 0; const wrong = [];
  steps.forEach((st, i) => { const b = st.it.band; bands[b] = bands[b] || { c: 0, t: 0 }; bands[b].t++; if (CS.answers[i] === st.it.a) { bands[b].c++; c++; } else wrong.push(i); });
  const level = levelFromBands(bands);
  const res = { score: c, total: steps.length, level, bands, wrong };
  S.checks.push({ id: 'chk-' + uid(), date: today(), kind: 'skill', test: CS.test, results: { [skill]: res } });
  touchActivity(); save(); CS.result = res;
}
function checkResult(skill, sk) {
  const r = CS.result;
  if (r.pending) return `<div class="summary"><div class="big" style="font-size:34px">${L('Отправлено', 'Submitted')}</div><p>${L('Тексты сохранены. Сделайте экспорт (Настройки → Экспорт) и пришлите его Claude — оценка по CEFR придёт в следующем пакете.', 'Your texts are saved. Make an export (Settings → Export) and send it to Claude — the CEFR grade will come with the next pack.')}</p></div><div class="actions"><button class="btn" data-act="back">${L('Готово', 'Done')}</button></div>`;
  let h = `<div class="summary"><div class="big">${r.level}</div><p>${r.total ? `${r.score} ${L('из', 'of')} ${r.total} · ` : ''}${skillName(skill)}</p></div>`;
  if (r.bands) h += groupHead(L('По уровням', 'By level')) + '<div class="group">' + BANDS.filter(b => r.bands[b]).map(b => { const x = r.bands[b]; const ok = x.t <= 2 ? x.c >= 1 : x.c / x.t >= 0.6; return `<div class="row static"><span class="row-main"><span class="row-title">${b}</span></span><span class="row-val">${x.c}/${x.t}</span><span class="pill ${ok ? 'good' : ''}">${ok ? L('пройден', 'passed') : L('не пройден', 'not passed')}</span></div>`; }).join('') + '</div>';
  if (r.wrong && r.wrong.length) {
    const steps = checkSteps(sk);
    h += groupHead(L('Ошибки', 'Mistakes')) + '<div class="group">' + r.wrong.map(i => { const it = steps[i].it, a = CS.answers[i]; return `<div class="row static"><span class="row-main"><span class="row-title">${md(it.q)}</span><span class="row-sub">${L('Ваш ответ', 'Your answer')}: ${esc(it.options[a])} · ${L('верно', 'correct')}: <b>${esc(it.options[it.a])}</b></span></span></div>`; }).join('') + '</div>';
  }
  h += `<div class="gfoot">${L('Уровень считается так: уровень засчитан, если верно не меньше 60% вопросов этого уровня и всех уровней ниже.', 'How it is scored: a level counts when at least 60% of its questions and of all lower levels are correct.')}</div>`;
  h += `<div class="actions"><button class="btn" data-act="back">${L('Готово', 'Done')}</button></div>`;
  return h;
}
function checkWriting(sk) {
  let h = '', ok = true;
  sk.parts.forEach((p, i) => {
    const n = words(CS.drafts[i]); if (n < p.minWords) ok = false;
    h += `<div class="lbl" style="margin:${i ? 26 : 0}px 16px 8px">${esc(p.title)}</div><div class="panel"><p class="prompt" style="margin:0;white-space:pre-line">${esc(p.prompt)}</p></div>
      <textarea class="field" style="margin-top:10px" id="cw-${i}" data-cw="${i}" placeholder="Start writing here…" lang="en" spellcheck="true">${esc(CS.drafts[i] || '')}</textarea>
      <div class="wc" id="cwc-${i}">${n} ${P(n, 'слово', 'слова', 'слов', 'word', 'words')} · ${L('минимум', 'minimum')} ${p.minWords}</div>`;
  });
  h += `<div class="actions"><button class="btn" data-act="check-submit-writing" id="cw-submit" ${ok ? '' : 'disabled'}>${L('Отправить на проверку', 'Submit for grading')}</button></div>
    <div class="gfoot">${L('Критерии: содержание, достижение цели, организация текста, язык. Черновик сохраняется, пока экран открыт.', 'Criteria: content, communicative achievement, organisation, language. Your draft is kept while this screen is open.')}</div>`;
  return h;
}
function checkSpeaking(sk) {
  if (CS.phase === 0) {
    let h = `<div class="hint">${L('Прочитайте или прослушайте вопрос и отвечайте вслух около минуты. Можно включить таймер.', 'Read or listen to each prompt and answer aloud for about a minute. You can use the timer.')}</div>`;
    h += sk.prompts.map((p, i) => `<div class="panel" style="margin-bottom:10px"><div class="lbl" style="margin:0 0 6px">${L('Вопрос', 'Prompt')} ${i + 1}</div><p class="prompt">${esc(p.t)}</p>

    S.lastCheck = today(); save();
    if (msgs.length) { render(); toast(msgs.length === 1 ? msgs[0] : L('Загружено обновлений: ', 'Updates loaded: ') + msgs.length); }
    else if (!silent) { render(); toast(L('Новых заданий пока нет', 'No new tasks yet')); }
  } catch (e) { if (!silent) toast(L('Нет связи с сайтом приложения. Попробуйте позже', 'Cannot reach the app site. Try again later')); }
}
if ('serviceWorker' in navigator && window.self === window.top && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}

/* ---------- direct links to screens (for design import: html.to.design etc.) ---------- */
const ROUTES = { lesson: 'p2-d1-g1', choice: 'p2-d1-g2', meaning: 'p2-d1-g3', gap: 'p2-d1-g4', order: 'p2-d1-g5', fix: 'p2-d1-g6', translate: 'p2-d1-g7', shadow: 'p2-d1-g8', cards: 'p2-d1-g9', write: 'p2-d1-g10', dialog: 'p2-d1-u8', mix: 'p2-d2-g9' };
function applyHash() {
  const h = (location.hash || '').slice(1);
  if (!h) return false;
  UI.stack = []; TS = null; RV = null; CS = null; UI.sheet = null;
  if (['today', 'english', 'media', 'progress', 'settings'].includes(h)) UI.tab = h;
  else if (h === 'show') { UI.tab = 'media'; UI.stack.push({ v: 'show', id: 'silicon-valley' }); }
  else if (h === 'review') { UI.tab = 'english'; UI.stack.push({ v: 'review' }); }
  else if (h === 'section') { UI.tab = 'english'; UI.stack.push({ v: 'section', sec: 'general' }); }
  else if (h === 'articles') { UI.tab = 'media'; UI.mseg = 'article'; }
  else if (h === 'article' && S.media[0]) { UI.tab = 'media'; UI.stack.push({ v: 'media-item', id: S.media[0].id }); }
  else if (h === 'checks') { UI.tab = 'progress'; UI.stack.push({ v: 'checks' }); }
  else if (h.startsWith('check-') && SKILLS.includes(h.slice(6))) { UI.tab = 'progress'; UI.stack.push({ v: 'check', skill: h.slice(6) }); }
  else if (ROUTES[h]) { UI.tab = 'today'; startTask(ROUTES[h]); }
  else return false;
  render(); renderSheet(); return true;
}
window.addEventListener('hashchange', applyHash);

if (!applyHash()) render();
checkPacks(true);
})();
</script>
